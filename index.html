<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cee's Diet & Gym plan</title>
<style>
:root{--bg:#0a0a0a;--card:#141414;--surface:#1c1c1c;--surface2:#101010;--accent:#22c55e;--accent2:#4ade80;--orange:#f97316;--blue:#3b82f6;--red:#ef4444;--text:#f0f0f0;--muted:#666;--soft:#555;--border:#1e1e1e;--header:rgba(10,10,10,.96);--done-bg:#0a1a0a;--skip-bg:#190b0b}
body.light{--bg:#f6f7f4;--card:#fff;--surface:#f0f2ed;--surface2:#fafbf8;--text:#111827;--muted:#6b7280;--soft:#4b5563;--border:#dfe3d8;--header:rgba(246,247,244,.96);--done-bg:#eaf8ee;--skip-bg:#fff0f0}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
/* HEADER */
.header{background:var(--header);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:14px 16px;position:sticky;top:0;z-index:50}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.header h1{font-size:18px;font-weight:800;line-height:1.15}
.goal-badge{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;padding:5px 11px;border-radius:20px;font-size:11px;font-weight:700}
.sync-badge{border:0;cursor:pointer;font:inherit;font-size:11px;font-weight:700;white-space:nowrap}
.sync-badge:disabled{cursor:wait;opacity:.8}
.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,12px);z-index:80;width:min(380px,calc(100% - 28px));padding:12px 14px;border-radius:8px;background:#111827;color:#fff;font-size:12px;font-weight:800;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.success{background:#15803d}.toast.warning{background:#b45309}.toast.error{background:#b91c1c}
.icon-badge{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:5px 9px;border-radius:20px;font-size:12px;font-weight:800;cursor:pointer}
.tabs{display:flex;gap:6px;overflow-x:auto}.tab{min-width:75px}
.tab{flex:1;padding:8px;border-radius:12px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:12px;font-weight:700;transition:all .18s;text-align:center}
.tab.active{background:var(--accent);border-color:var(--accent);color:#000}
/* MAIN */
.main{max-width:760px;margin:0 auto;padding:16px 14px 100px}
/* PROGRESS RING */
.hero-progress{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px}
.ring-wrap{position:relative;width:96px;height:96px;flex-shrink:0}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--border);stroke-width:9}
.ring-fill{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;color:var(--accent)}
.ring-text strong{font-size:20px;line-height:1}
.ring-sub{font-size:10px;color:var(--muted);font-weight:700;margin-top:4px}
.hero-info{flex:1}
.hero-info h2{font-size:15px;font-weight:800;margin-bottom:4px}
.hero-info p{font-size:12px;color:var(--muted);line-height:1.6}
.hero-info .milestone{font-size:12px;color:var(--orange);margin-top:4px;font-weight:600}
/* MACRO BAR */
.macro-row{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:14px}
.macro-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.macro-card .mv{font-size:22px;font-weight:800}
.macro-card .ml{font-size:10px;color:var(--muted);margin-top:2px}
.macro-card .mp{height:4px;background:#1e1e1e;border-radius:2px;margin-top:8px;overflow:hidden}
.macro-card .mf{height:100%;border-radius:2px;transition:width .4s}
.kcal-fill{background:linear-gradient(90deg,var(--orange),#fbbf24)}
/* MEAL CARDS */
.sec-lbl{font-size:9px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.meal-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:8px;display:flex;align-items:center;gap:14px;transition:all .2s;cursor:pointer}
.meal-card.checked{border-color:#14532d;background:var(--done-bg)}
.meal-card.skipped{border-color:#4a1d1d;background:var(--skip-bg)}
.meal-card.modified{border-color:#7c2d12;background:#fff7ed}
body:not(.light) .meal-card.modified{background:#1f1308}
.meal-check{width:36px;height:36px;border-radius:10px;border:2px solid #2a2a2a;background:transparent;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .2s;cursor:pointer}
.meal-check.on{background:var(--accent);border-color:var(--accent)}
.meal-check.skip{background:#ef4444;border-color:#ef4444;color:#fff}
.meal-check.mod{background:#f97316;border-color:#f97316;color:#fff}
.meal-body{flex:1;min-width:0}
.meal-time{font-size:10px;color:var(--muted);font-weight:700;margin-bottom:3px}
.meal-name{font-size:13px;font-weight:700;margin-bottom:4px;line-height:1.3}
.meal-desc{font-size:11px;color:var(--soft);line-height:1.4}
.meal-macros{display:flex;gap:8px;margin-top:6px}
.meal-chip{padding:2px 7px;border-radius:6px;font-size:10px;font-weight:700}
.mc-kcal{background:#2a1500;color:#fb923c}
.meal-actions{display:flex;gap:8px;margin-top:10px}
.meal-action{border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:8px;padding:7px 9px;font-size:11px;font-weight:800;cursor:pointer}
.meal-action.done.on{background:var(--accent);border-color:var(--accent);color:#000}
.meal-action.skip.on{background:#ef4444;border-color:#ef4444;color:#fff}
.meal-action.mod.on{background:#f97316;border-color:#f97316;color:#fff}
.meal-note{width:100%;margin-top:8px;padding:9px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px}
.meal-note:focus{outline:none;border-color:var(--accent)}
.custom-macros{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.custom-macro{width:100%;padding:9px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px}
.custom-macro:focus{outline:none;border-color:var(--accent)}
.meal-composer{margin-top:10px;border-top:1px solid var(--border);padding-top:10px}
.meal-composer summary{cursor:pointer;font-size:11px;font-weight:800;color:var(--text);list-style:none;display:flex;justify-content:space-between;gap:8px}
.meal-composer summary::-webkit-details-marker{display:none}
.food-list{display:grid;gap:7px;margin-top:9px}
.food-row{display:grid;grid-template-columns:minmax(0,1fr) 72px 58px 30px 30px;gap:6px;align-items:center;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px}
.food-name{font-size:11px;font-weight:700;line-height:1.3;min-width:0}
.food-qty,.food-select{width:100%;min-width:0;padding:8px;background:var(--surface);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:11px}
.food-kcal{font-size:10px;font-weight:800;color:var(--orange);text-align:right}
.food-icon{width:30px;height:30px;border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:7px;cursor:pointer;font-size:14px}
.food-icon.on{color:#eab308}
.food-add-row{display:grid;grid-template-columns:minmax(0,1fr) 72px 42px;gap:7px;margin-top:9px}
.preset-row{display:grid;grid-template-columns:minmax(0,1fr) 72px 36px;gap:7px;margin-top:9px}
.composer-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.small-command{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:7px;padding:7px 9px;font-size:10px;font-weight:800;cursor:pointer}
.day-actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.meal-actual{margin-top:6px;font-size:11px;font-weight:800;color:var(--orange)}
.history-actions{display:flex;gap:6px;margin-top:5px}
@media(max-width:520px){.food-row{grid-template-columns:minmax(0,1fr) 66px 52px 30px 30px}.food-row .food-name{font-size:10px}}
/* WEIGHT PAGE */
.weight-input-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px}
.weight-input-card h3{font-size:14px;font-weight:800;margin-bottom:14px}
.weight-input-row{display:flex;gap:10px;align-items:center}
.weight-input{flex:1;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:20px;font-weight:800;text-align:center}
.weight-input:focus{outline:none;border-color:var(--accent)}
.weight-save-btn{padding:12px 20px;border-radius:10px;border:none;background:var(--accent);color:#000;font-size:13px;font-weight:800;cursor:pointer}
/* WEIGHT CHART */
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
.chart-card h4{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:14px}
.chart-wrap{overflow-x:auto}
/* WEIGHT TABLE */
.weight-table{width:100%;border-collapse:collapse;font-size:12px}
.weight-table th{text-align:left;padding:6px 8px;color:#444;font-size:10px;letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid var(--border)}
.weight-table td{padding:9px 8px;border-bottom:1px solid #111;color:#ccc}
.weight-table tr.current td{color:var(--accent);font-weight:700}
.weight-table tr.past td{color:#555}
.weight-actions{display:flex;gap:4px;justify-content:flex-end}
.weight-action{width:28px;height:28px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text);cursor:pointer;font-size:12px}
.delta-pos{color:var(--accent)}
.delta-neg{color:#ef4444}
/* RULES */
.rules{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-top:8px}
.rules h4{font-size:9px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#333;margin-bottom:10px}
.rule{font-size:12px;padding:5px 0;border-bottom:1px solid #111;color:#777}
.rule:last-child{border:none}
/* TRAINING */
.training-day{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px}
.training-day h3{font-size:15px;font-weight:800;margin-bottom:4px}
.training-meta{font-size:11px;color:var(--muted);margin-bottom:10px}
.exercise-row{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}
.exercise-row:last-child{border-bottom:none}
.exercise-entry{border-bottom:1px solid var(--border);padding-bottom:8px}
.exercise-entry:last-child{border-bottom:none}
.exercise-entry .exercise-row{border-bottom:none;padding-bottom:6px}
.exercise-check{width:28px;height:28px;border-radius:8px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;font-weight:800}
.exercise-check.on{background:var(--accent);border-color:var(--accent);color:#000}
.exercise-text{font-size:12px;color:var(--text);line-height:1.45}
.exercise-text.done-text{text-decoration:line-through;color:var(--muted)}
.session-comment{width:100%;min-height:110px;resize:vertical;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:12px;font-size:13px;line-height:1.5}
.session-comment:focus{outline:none;border-color:var(--accent)}
.exercise-note{width:calc(100% - 38px);margin-left:38px;padding:8px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:11px}
.exercise-note:focus{outline:none;border-color:var(--accent)}
.week-grid{display:grid;grid-template-columns:1fr;gap:8px}
.week-day{border:1px solid var(--border);background:var(--surface2);border-radius:10px;padding:10px}
.week-day.today{border-color:var(--accent);background:var(--done-bg)}
.week-day summary{list-style:none;cursor:pointer}
.week-day summary::-webkit-details-marker{display:none}
.week-day-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.week-day-name{font-size:12px;font-weight:800;color:var(--text)}
.week-day-progress{font-size:10px;font-weight:800;color:var(--accent)}
.week-day-type{font-size:11px;color:var(--muted);line-height:1.35}
.week-exercises{margin-top:10px;padding-top:8px;border-top:1px solid var(--border);display:grid;gap:7px}
.week-exercise{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--soft);line-height:1.35}
.exercise-video{width:96px;height:58px;border-radius:10px;background:#111827;color:#fff;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;text-decoration:none;font-size:18px;font-weight:900;position:relative;overflow:hidden;cursor:pointer}
.week-exercise .exercise-video{width:84px;height:50px}
.exercise-video img{width:100%;height:100%;object-fit:cover;display:block}
.exercise-video::after{content:'▶';position:absolute;inset:auto auto 6px 7px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px}
.exercise-video.no-video{background:var(--surface);color:var(--muted);font-size:10px;line-height:1.2;text-align:center;padding:6px}
.exercise-video.no-video::after{display:none}
.video-modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:18px;z-index:100}
.video-panel{width:min(820px,100%);background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 20px 80px rgba(0,0,0,.35)}
.video-panel-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border)}
.video-panel-title{font-size:13px;font-weight:800;color:var(--text);line-height:1.3}
.video-close{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:7px 10px;font-weight:800;cursor:pointer}
.video-frame{width:100%;aspect-ratio:16/9;border:0;display:block;background:#000}
.video-empty{padding:28px 16px;color:var(--muted);font-size:13px;line-height:1.5}
/* HISTORY */
.history-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px}
.history-card h3{font-size:15px;font-weight:800;margin-bottom:4px}
.history-summary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.history-stat{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px}
.history-stat strong{display:block;font-size:18px;color:var(--accent);margin-bottom:2px}
.history-stat span{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase}
.history-date{font-size:13px;font-weight:800;margin-bottom:8px;color:var(--text)}
.history-line{font-size:12px;color:var(--soft);line-height:1.45;padding:5px 0;border-bottom:1px solid var(--border)}
.history-line:last-child{border-bottom:none}
.history-note{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.weekly-average{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end;margin-top:12px}
.weekly-average strong{display:block;font-size:28px;color:var(--orange);line-height:1}
.weekly-average span{font-size:11px;color:var(--muted)}
.weekly-target{text-align:right;font-size:12px;font-weight:800;color:var(--text)}
.weekly-bar{height:8px;background:var(--surface);border-radius:4px;overflow:hidden;margin-top:12px}
.weekly-bar-fill{height:100%;background:var(--orange);border-radius:4px;transition:width .4s}

:root{--muted:#aaa;--soft:#bbb}
.weight-table td{color:var(--text);border-color:var(--border)}
.weight-table th{color:var(--muted)}
button,.food-icon,.weight-action,.icon-badge{min-width:44px;min-height:44px}
input,select,textarea{font-size:16px!important}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.food-row{grid-template-columns:minmax(0,1fr) 80px 60px 44px 44px}
.food-add-row,.preset-row{grid-template-columns:minmax(0,1fr) auto 44px}
.field-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0}
.field-grid label{font-size:12px}.field-grid input,.field-grid select{width:100%;min-width:0}
.rounds{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.rounds label{padding:10px;background:var(--surface);border-radius:8px;display:flex;align-items:center;gap:8px}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--accent)}
.timer-clock{font-size:40px;font-variant-numeric:tabular-nums;font-weight:800;margin:10px 0}
fieldset{border:0;min-width:0}fieldset:disabled{opacity:.65}
@media(max-width:520px){.food-row{grid-template-columns:minmax(0,1fr) 80px 44px 44px}.food-name{grid-column:1/-1}.food-kcal{grid-column:1}.header-top{flex-wrap:wrap;gap:10px}.field-grid{grid-template-columns:1fr}.weight-input-row{flex-wrap:wrap}.weight-input{min-width:0;width:100%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="header">
  <div class="header-top">
    <h1>Cee's Diet & Gym plan</h1>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="icon-badge" aria-label="Switch color theme" id="themeToggle" onclick="toggleTheme()">🌙</button>
      <button class="goal-badge sync-badge" id="cloudStatus" type="button" onclick="syncNow()" title="Sync now">☁️ Sync</button>
      <span class="goal-badge">🎯 97kg · 22 Oct</span>
    </div>
  </div>
  <div class="tabs">
    <button class="tab active" id="tab0" onclick="switchTab(0)">📋 Today</button>
    <button class="tab" id="tab1" onclick="switchTab(1)">🏋️ Training</button>
    <button class="tab" id="tab2" onclick="switchTab(2)">⚖️ Weight</button>
    <button class="tab" id="tab3" onclick="switchTab(3)">📊 History</button>
    <button class="tab" id="tab4" onclick="switchTab(4)">🏃 5K Runs</button>
  </div>
</div>
<div class="main" id="main"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// ═══════════════════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════════════════
const MEALS = [
  {id:'m1',time:'07:30',emoji:'🥣',name:'Breakfast',desc:'Greek yogurt/quark 300g · Oats 100g · Peanut butter 40g · 1 banana · Whole milk 300ml · 4 whole eggs',kcal:1300},
  {id:'m2',time:'10:00',emoji:'💪',name:'Gainer 1 — Hard Mass Harder',desc:'2 scoops (100g powder)',kcal:390},
  {id:'m3',time:'12:30',emoji:'🍚',name:'Lunch',desc:'Cooked rice 250g · Chicken 250g or lean beef · Vegetables · 1 tbsp olive oil',kcal:1150},
  {id:'m4',time:'15:30',emoji:'🍞',name:'Snack',desc:'Greek yogurt 250g · Wholemeal bread 4 slices · Peanut butter 60g · 1 apple',kcal:900},
  {id:'m5',time:'18:30',emoji:'🍝',name:'Dinner',desc:'Cooked pasta or rice 250g · Chicken 250g or lean beef · Vegetables · 1 tbsp olive oil',kcal:1150},
  {id:'m6',time:'21:00',emoji:'💪',name:'Gainer 2 — Hard Mass Harder',desc:'2 scoops (100g powder)',kcal:390}
];
const TOTAL_KCAL = MEALS.reduce((a,m)=>a+m.kcal,0); // 5500

const BASE_FOODS = [
  {id:'egg',name:'Medium whole egg',unit:'piece',base:1,kcal:68,defaultQty:1},
  {id:'oats',name:'Rolled oats',unit:'g',base:100,kcal:370,defaultQty:100},
  {id:'greek-yogurt',name:'Greek yogurt',unit:'g',base:100,kcal:111,defaultQty:250},
  {id:'peanut-butter',name:'Peanut butter',unit:'g',base:100,kcal:588,defaultQty:40},
  {id:'banana',name:'Banana',unit:'piece',base:1,kcal:105,defaultQty:1},
  {id:'apple',name:'Apple',unit:'piece',base:1,kcal:95,defaultQty:1},
  {id:'whole-milk',name:'Whole milk',unit:'ml',base:100,kcal:64,defaultQty:300},
  {id:'wholemeal-bread',name:'Wholemeal bread',unit:'slice',base:1,kcal:90,defaultQty:1},
  {id:'cooked-rice',name:'Cooked rice',unit:'g',base:100,kcal:130,defaultQty:250},
  {id:'cooked-pasta',name:'Cooked pasta',unit:'g',base:100,kcal:157,defaultQty:250},
  {id:'chicken',name:'Cooked chicken breast',unit:'g',base:100,kcal:165,defaultQty:250},
  {id:'lean-beef',name:'Cooked lean beef',unit:'g',base:100,kcal:200,defaultQty:250},

function ls(k){return JSON.parse(localStorage.getItem(k)||'null')}
function ss(k,v){localStorage.setItem(k,JSON.stringify(v))}
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
const CLOUD_ENDPOINT = '/api/nutrition-data';
let cloudReady = false;
let cloudStatus = 'local';
let cloudError = '';
let cloudState = {meals:{},weights:null,training:{},foods:{},favorites:{},mealPresets:{}};
let cloudSyncPromise = null;
let saveAllPromise = null;
let autoSaveTimer = null;
let toastTimer = null;
const PENDING_CHANGES_KEY = `${STORAGE_PREFIX}_pending_sync`;
let pendingChanges = ls(PENDING_CHANGES_KEY)||{};

function applyTheme(theme){
  document.body.classList.toggle('light',theme==='light');
  const el=document.getElementById('themeToggle');
  if(el)el.textContent=theme==='light'?'☀️':'🌙';
}
function currentTheme(){return localStorage.getItem(`${STORAGE_PREFIX}_theme`)||'light'}
function toggleTheme(){
  const next=currentTheme()==='dark'?'light':'dark';
  localStorage.setItem(`${STORAGE_PREFIX}_theme`,next);
  applyTheme(next);
}

function setCloudStatus(status,message=''){
  cloudStatus=status;
  cloudError=message;
  const el=document.getElementById('cloudStatus');
  if(el){
    el.textContent=status==='synced'?'☁️ Sync':status==='saving'?'☁️ Saving...':status==='syncing'?'☁️ Sync...':'⚠️ Retry';
    el.title=message||'Sync now';
    el.disabled=status==='saving'||status==='syncing';
  }
}
function mutationId(mutation){
  return `${mutation.scope}:${mutation.key}`;
}
function showToast(message,type='success'){
  const el=document.getElementById('toast');
  if(!el)return;
  clearTimeout(toastTimer);
  el.textContent=message;
  el.className=`toast ${type} show`;
  toastTimer=setTimeout(()=>el.className=`toast ${type}`,2800);
}
function scheduleCloudSave(delay=350){
  clearTimeout(autoSaveTimer);
  autoSaveTimer=setTimeout(()=>{
    autoSaveTimer=null;
    saveAllChanges();
  },delay);
}
function applyMutationLocally(mutation){
  cloudState[mutation.scope]=cloudState[mutation.scope]||{};
  if(mutation.value===null)delete cloudState[mutation.scope][mutation.key];
  else cloudState[mutation.scope][mutation.key]=mutation.value;
}
function stageCloudChange(mutation){
  pendingChanges[mutationId(mutation)]=mutation;
  ss(PENDING_CHANGES_KEY,pendingChanges);
  if(cloudReady)applyMutationLocally(mutation);
  scheduleCloudSave();
}
function applyPendingChanges(){
  Object.values(pendingChanges).forEach(applyMutationLocally);
}
async function responseError(res){
  try{
    const body=await res.json();
    return body.error||`API ${res.status}`;
  }catch{
    return `API ${res.status}`;
  }
}
async function syncNow({mergeLocal=false,quiet=false,skipSaveWait=false}={}){
  if(cloudSyncPromise)return cloudSyncPromise;
  cloudSyncPromise=(async()=>{
    try{
      if(!quiet)setCloudStatus('syncing');
      if(saveAllPromise&&!skipSaveWait)await saveAllPromise;
      const res=await fetch(CLOUD_ENDPOINT,{cache:'no-store'});
      if(!res.ok)throw new Error(await responseError(res));
      cloudState=await res.json();
      cloudState.meals=cloudState.meals||{};
      cloudState.weights=cloudState.weights||{};
      cloudState.training=cloudState.training||{};
      cloudState.foods=cloudState.foods||{};
      cloudState.favorites=cloudState.favorites||{};
      cloudState.mealPresets=cloudState.mealPresets||{};
      cloudReady=true;
      applyPendingChanges();
      if(mergeLocal)mergeLocalIntoCloud();
      setCloudStatus('synced');
      if(!document.activeElement?.matches('input, textarea, select'))render();
    }catch(e){
      console.warn('Supabase sync unavailable:',e);
      setCloudStatus('local',e.message||'Sync unavailable');
    }finally{
      cloudSyncPromise=null;
    }
  })();
  return cloudSyncPromise;
}
async function saveAllChanges(){
  if(saveAllPromise)return saveAllPromise;
  if(!Object.keys(pendingChanges).length)return true;
  clearTimeout(autoSaveTimer);
  autoSaveTimer=null;
  saveAllPromise=(async()=>{
    try{
      setCloudStatus('saving');
      if(!cloudReady)await syncNow({mergeLocal:true,quiet:true,skipSaveWait:true});
      if(!cloudReady)throw new Error(cloudError||'Sync unavailable');

      const changes=Object.entries(pendingChanges);
      for(const [id,mutation] of changes){
        const res=await fetch(CLOUD_ENDPOINT,{
          method:'POST',
          headers:{'content-type':'application/json'},
          body:JSON.stringify({mutation})
        });
        if(!res.ok)throw new Error(await responseError(res));
      }

      const verifyRes=await fetch(CLOUD_ENDPOINT,{cache:'no-store'});
      if(!verifyRes.ok)throw new Error(await responseError(verifyRes));
      const verifiedState=await verifyRes.json();
      for(const [,mutation] of changes){
        const savedValue=verifiedState?.[mutation.scope]?.[mutation.key];
        const confirmed=mutation.value===null
          ? savedValue===undefined
          : JSON.stringify(savedValue)===JSON.stringify(mutation.value);
        if(!confirmed){
          throw new Error('Supabase did not confirm all changes');
        }
      }

      for(const [id,mutation] of changes){
        if(JSON.stringify(pendingChanges[id])===JSON.stringify(mutation))delete pendingChanges[id];
      }
      ss(PENDING_CHANGES_KEY,pendingChanges);
      cloudState={
        meals:verifiedState.meals||{},
        weights:verifiedState.weights||{},
        training:verifiedState.training||{},
        foods:verifiedState.foods||{},
        favorites:verifiedState.favorites||{},
        mealPresets:verifiedState.mealPresets||{}
      };
      applyPendingChanges();
      setCloudStatus('synced');
      if(!document.activeElement?.matches('input, textarea, select'))render();
      showToast('Changes saved','success');
      return true;
    }catch(e){
      console.warn('Supabase save failed:',e);
      setCloudStatus('local',e.message||'Unable to save');
      showToast('Offline: changes saved locally','warning');
      return false;
    }finally{
      saveAllPromise=null;
    }
  })();
  return saveAllPromise;
}
function mealEntry(entry){
  if(entry&&typeof entry==='object'){
    return {
      status:entry.status||'pending',
      note:entry.note||'',
      kcal:Number(entry.kcal)||0,
      items:Array.isArray(entry.items)?entry.items:[],
      extra:Boolean(entry.extra),
      name:entry.name||'',
      time:entry.time||''
    };
  }
  return {status:entry?'done':'pending',note:'',kcal:0,items:[],extra:false,name:'',time:''};
}
function hasData(obj){
  return obj&&typeof obj==='object'&&Object.keys(obj).length>0;
}
function mergeLocalIntoCloud(){
  if(!cloudReady)return;
  const mutations=[];
  cloudState.weights=cloudState.weights||{};
  Object.entries(INITIAL_WEIGHTS).forEach(([date,val])=>{
    if(!cloudState.weights[date]){
      cloudState.weights[date]=val;
      mutations.push({scope:'weights',key:date,value:val});
    }
  });
  const localMeals=collectLocalMeals();
  if(hasData(localMeals)){
    cloudState.meals=cloudState.meals||{};
    Object.entries(localMeals).forEach(([date,val])=>{
      if(hasData(val)&&!hasData(cloudState.meals[date])){
        cloudState.meals[date]=val;
        mutations.push({scope:'meals',key:date,value:val});
      }
    });
  }
  const localWeights=migrateWeightDates(ls(`${STORAGE_PREFIX}_weights`)||{});
  if(hasData(localWeights)){
    cloudState.weights=cloudState.weights||{};
    Object.entries(localWeights).forEach(([date,val])=>{
      if(!cloudState.weights[date]){
        cloudState.weights[date]=val;
        mutations.push({scope:'weights',key:date,value:val});
      }
    });
  }
  const localTraining=ls(`${STORAGE_PREFIX}_training`)||{};
  if(hasData(localTraining)){
    cloudState.training=cloudState.training||{};
    Object.entries(localTraining).forEach(([date,val])=>{
      if(!cloudState.training[date]){
        cloudState.training[date]=val;
        mutations.push({scope:'training',key:date,value:val});
      }
    });
  }
  const localFoods=ls(`${STORAGE_PREFIX}_foods`)||{};
  Object.entries(localFoods).forEach(([id,val])=>{
    if(!cloudState.foods[id])mutations.push({scope:'foods',key:id,value:val});
  });
  const localFavorites=ls(`${STORAGE_PREFIX}_favorites`)||{};
  Object.entries(localFavorites).forEach(([id,val])=>{
    if(cloudState.favorites[id]===undefined)mutations.push({scope:'favorites',key:id,value:val});
  });
  const localMealPresets=ls(`${STORAGE_PREFIX}_meal_presets`)||{};
  Object.entries(localMealPresets).forEach(([id,val])=>{
    if(!cloudState.mealPresets[id])mutations.push({scope:'mealPresets',key:id,value:val});
  });
  mutations.forEach(stageCloudChange);
}
function mealsForDate(date){
  return cloudReady?(cloudState.meals[date]||{}):(ls(`${STORAGE_PREFIX}_meals_${date}`)||{});
}
function todayMeals(){return mealsForDate(today())}
function saveMealsForDate(date,d){
  ss(`${STORAGE_PREFIX}_meals_${date}`,d);
  stageCloudChange({scope:'meals',key:date,value:d});
}
function saveMeals(d){saveMealsForDate(today(),d)}
function customFoods(){return cloudReady?(cloudState.foods||{}):(ls(`${STORAGE_PREFIX}_foods`)||{})}
function foodFavorites(){return cloudReady?(cloudState.favorites||{}):(ls(`${STORAGE_PREFIX}_favorites`)||{})}
function mealPresets(){return cloudReady?(cloudState.mealPresets||{}):(ls(`${STORAGE_PREFIX}_meal_presets`)||{})}
function recentFoodIds(limit=8){
  const source=cloudReady?(cloudState.meals||{}):collectLocalMeals();
  const seen=[];
  Object.keys(source).sort().reverse().forEach(date=>{
    Object.values(source[date]||{}).reverse().forEach(rawEntry=>{
      const entry=mealEntry(rawEntry);
      [...entry.items].reverse().forEach(item=>{
        if(item.foodId&&!seen.includes(item.foodId))seen.push(item.foodId);
      });
    });
  });
  return seen.slice(0,limit);
}
function allFoods(){
  const custom=Object.values(customFoods());
  const favorites=foodFavorites();
  const recent=recentFoodIds();
  return [...BASE_FOODS,...custom].sort((a,b)=>{
    const fav=(favorites[b.id]?1:0)-(favorites[a.id]?1:0);
    const recentA=recent.includes(a.id)?recent.indexOf(a.id):999;
    const recentB=recent.includes(b.id)?recent.indexOf(b.id):999;
    return fav||(recentA-recentB)||a.name.localeCompare(b.name,'en');
  });
}
function foodById(id){return allFoods().find(food=>food.id===id)}
function itemCalories(item){return Math.round((Math.max(0,Number(item.qty)||0)/Math.max(1,Number(item.base)||1))*(Number(item.kcal)||0))}
function itemsCalories(entry){return (entry.items||[]).reduce((sum,item)=>sum+itemCalories(item),0)}
function mealCalories(entry,plan){
  if(entry.status==='skipped'||entry.status==='pending')return 0;
  if(entry.items?.length)return itemsCalories(entry);
  if(entry.status==='modified')return Number(entry.kcal)||0;
  return Number(plan?.kcal)||Number(entry.kcal)||0;
}
function mealDefinitions(dayMeals){
  const extras=Object.entries(dayMeals||{}).filter(([,value])=>value&&typeof value==='object'&&value.extra).map(([id,value])=>({
    id,
    time:value.time||'--:--',
    emoji:'➕',
    name:value.name||'Extra meal',
    desc:'Custom meal',
    kcal:0,
    extra:true
  }));
  return [...MEALS,...extras].sort((a,b)=>a.time.localeCompare(b.time));
}
function foodOptions(){
  const favorites=foodFavorites();
  const recent=new Set(recentFoodIds());
  return allFoods().map(food=>`<option value="${food.id}">${favorites[food.id]?'★ ':recent.has(food.id)?'Recent · ':''}${escapeText(food.name)} · ${food.kcal} kcal/${food.base}${food.unit}</option>`).join('');
}
function mealPresetOptions(){
  return Object.values(mealPresets()).filter(Boolean).sort((a,b)=>a.name.localeCompare(b.name,'en')).map(preset=>`<option value="${preset.id}">${escapeText(preset.name)} · ${itemsCalories(preset)} kcal</option>`).join('');
}
function saveMealPreset(mealId,date=today()){
  const day=mealsForDate(date);
  const entry=mealEntry(day[mealId]);
  if(!entry.items.length&&!entry.kcal){alert('Add at least one food before saving this meal.');return}
  const meal=mealDefinitions(day).find(value=>value.id===mealId);
  const name=(prompt('Favorite meal name',`${meal?.name||'Meal'} usual`)||'').trim();
  if(!name)return;
  const preset={
    id:`preset-${Date.now()}`,
    name,
    items:JSON.parse(JSON.stringify(entry.items)),
    kcal:entry.kcal,
    note:entry.note
  };
  const presets={...mealPresets(),[preset.id]:preset};
  ss(`${STORAGE_PREFIX}_meal_presets`,presets);
  stageCloudChange({scope:'mealPresets',key:preset.id,value:preset});
  render();
}
function applyMealPreset(mealId,date=today()){
  const select=document.getElementById(`preset-select-${date}-${mealId}`);
  const preset=mealPresets()[select?.value];
  if(!preset)return;
  const day=mealsForDate(date);
  const entry=mealEntry(day[mealId]);
  entry.items=JSON.parse(JSON.stringify(preset.items||[])).map(item=>({...item,id:`i${Date.now()}${Math.random().toString(36).slice(2,6)}`}));
  entry.kcal=Number(preset.kcal)||0;
  entry.note=preset.note||'';
  entry.status='modified';
  day[mealId]=entry;
  saveMealsForDate(date,day);
  render();
}
function removeMealPreset(mealId,date=today()){
  const select=document.getElementById(`preset-select-${date}-${mealId}`);
  const id=select?.value;
  if(!id||!confirm('Delete this favorite meal?'))return;
  const presets={...mealPresets(),[id]:null};
  ss(`${STORAGE_PREFIX}_meal_presets`,presets);
  stageCloudChange({scope:'mealPresets',key:id,value:null});
  render();
}
function addFoodToMeal(mealId,date=today(),forcedFoodId=''){
  const select=document.getElementById(`food-select-${date}-${mealId}`);
  const food=foodById(forcedFoodId||select?.value);
  if(!food)return;
  const day=mealsForDate(date);
  const entry=mealEntry(day[mealId]);
  entry.items.push({
    id:`i${Date.now()}${Math.random().toString(36).slice(2,6)}`,
    foodId:food.id,
    name:food.name,
    unit:food.unit,
    base:food.base,
    kcal:food.kcal,
    qty:Number(document.getElementById(`portion-${date}-${mealId}`)?.value)>0?Number(document.getElementById(`portion-${date}-${mealId}`).value):food.defaultQty
  });
  entry.status='modified';
  day[mealId]=entry;
  saveMealsForDate(date,day);
  render();
}
function updateFoodQty(mealId,itemId,value,date=today()){
  const day=mealsForDate(date);
  const entry=mealEntry(day[mealId]);
  const item=entry.items.find(value=>value.id===itemId);
  if(!item)return;
  item.qty=Math.max(0,Number(value)||0);
  entry.status='modified';
  day[mealId]=entry;
  saveMealsForDate(date,day);
  render();
}
function removeFoodItem(mealId,itemId,date=today()){
  const day=mealsForDate(date);
  const entry=mealEntry(day[mealId]);
  entry.items=entry.items.filter(item=>item.id!==itemId);
  if(!entry.items.length&&!entry.note&&!entry.kcal)entry.status='pending';
  day[mealId]=entry;
  saveMealsForDate(date,day);
  render();
}
function toggleFoodFavorite(foodId){
  const values={...foodFavorites()};
  values[foodId]=!values[foodId];
  ss(`${STORAGE_PREFIX}_favorites`,values);
  stageCloudChange({scope:'favorites',key:foodId,value:values[foodId]});
  render();
}
function addCustomFood(mealId,date=today()){
  const name=prompt('Food name');
  if(!name?.trim())return;
  let unit=(prompt('Unit: g, ml, piece or slice','g')||'g').trim().toLowerCase();
  if(!['g','ml','piece','slice'].includes(unit))unit='g';
  const base=unit==='g'||unit==='ml'?100:1;
  const kcal=Math.max(0,Number(prompt(`Calories per ${base} ${unit}`,''))||0);
  if(!kcal)return;
  const defaultQty=Math.max(0,Number(prompt(`Usual portion in ${unit}`,String(base)))||base);
  const food={id:`custom-${Date.now()}`,name:name.trim(),unit,base,kcal,defaultQty};
  const foods={...customFoods(),[food.id]:food};
  ss(`${STORAGE_PREFIX}_foods`,foods);
  stageCloudChange({scope:'foods',key:food.id,value:food});
  addFoodToMeal(mealId,date,food.id);
}
function addExtraMeal(){
  const name=(prompt('Extra meal name','Extra meal')||'Extra meal').trim();
  const now=new Date();
  const time=now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  const day=todayMeals();
  const id=`extra-${Date.now()}`;
  day[id]={status:'pending',note:'',kcal:0,items:[],extra:true,name,time};
  saveMeals(day);
  render();
}
function removeExtraMeal(mealId,date=today()){
  const day=mealsForDate(date);
  delete day[mealId];
  saveMealsForDate(date,day);
  render();
}
function previousDate(date){
  const value=new Date(`${date}T12:00:00`);
  value.setDate(value.getDate()-1);
  return value.toISOString().slice(0,10);
}
function duplicateYesterday(mealId){
  const source=mealsForDate(previousDate(today()));
  const original=source[mealId];
  if(!original){alert('No matching meal was saved yesterday.');return}
  const day=todayMeals();
  day[mealId]=JSON.parse(JSON.stringify(original));
  saveMeals(day);
  render();
}
function resumeMeal(date,mealId){
  const source=mealsForDate(date)[mealId];
  if(!source)return;
  const day=todayMeals();
  const targetId=source.extra?`extra-${Date.now()}`:mealId;
  day[targetId]=JSON.parse(JSON.stringify(source));
  saveMeals(day);
  switchTab(0);
}
function weights(){
  const w=migrateWeightDates(cloudReady?(cloudState.weights||{}):(ls(`${STORAGE_PREFIX}_weights`)||{}));
  Object.entries(INITIAL_WEIGHTS).forEach(([date,val])=>{
    if(!w[date])w[date]=val;
  });
  return w;
}
function saveWeight(date,val){
  const w=weights();
  w[date]=val;
  ss(`${STORAGE_PREFIX}_weights`,w);
  stageCloudChange({scope:'weights',key:date,value:val});
}
function training(){
  return cloudReady?(cloudState.training||{}):(ls(`${STORAGE_PREFIX}_training`)||{});
}
function saveTraining(t,date=trainingDate){
  ss(`${STORAGE_PREFIX}_training`,t);
  stageCloudChange({scope:'training',key:date,value:t[date]});
}

// ── TODAY ────────────────────────────────────────────
function renderToday(){
  const checked=todayMeals();
  const definitions=mealDefinitions(checked);
  const doneKcal=definitions.reduce((sum,meal)=>sum+mealCalories(mealEntry(checked[meal.id]),meal),0);
  const pctK=Math.round(doneKcal/TOTAL_KCAL*100);
  const mealsDone=definitions.filter(m=>mealEntry(checked[m.id]).status==='done').length;
  const mealsSkipped=definitions.filter(m=>mealEntry(checked[m.id]).status==='skipped').length;
  const mealsModified=definitions.filter(m=>mealEntry(checked[m.id]).status==='modified').length;
  // weight progress
  const w=weights();
  const lastWeight=Object.entries(w).sort((a,b)=>a[0]>b[0]?1:-1).filter(([,v])=>v).pop()?.[1]||WEIGHT_START;
  const totalGain=WEIGHT_GOAL-WEIGHT_START;
  const done=lastWeight-WEIGHT_START;
  const pctWeight=Math.max(0,Math.min(100,Math.round(done/totalGain*100)));
  // next milestone
  const nextM=MILESTONES.find(m=>lastWeight<m.target)||{month:'Goal',target:WEIGHT_GOAL};
  const daysLeft=Math.round((new Date(GOAL_DATE)-new Date())/(1000*60*60*24));
  // ring stroke
  const circ=2*Math.PI*39;
  const offset=circ*(1-pctWeight/100);
  const mealsHTML=definitions.map(meal=>renderMealCard(meal,checked,today())).join('');
  document.getElementById('main').innerHTML=`
  <div class="hero-progress">
    <div class="ring-wrap">
      <svg width="96" height="96" viewBox="0 0 96 96">
        <circle class="ring-bg" cx="48" cy="48" r="39"/>
        <circle class="ring-fill" cx="48" cy="48" r="39" stroke-dasharray="${circ}" stroke-dashoffset="${offset}"/>
      </svg>
      <div class="ring-text"><strong>${pctWeight}%</strong><span class="ring-sub">${lastWeight} kg</span></div>
    </div>
    <div class="hero-info">
      <h2>${pctWeight}% towards ${WEIGHT_GOAL}kg</h2>
      <p>${lastWeight}kg → ${WEIGHT_GOAL}kg · ${daysLeft} days left</p>
      <p class="milestone">→ Next: ${nextM.target}kg by ${nextM.month}</p>
    </div>
  </div>
  <div class="macro-row">
    <div class="macro-card">
      <div class="mv" style="color:var(--orange)">${doneKcal}<span style="font-size:12px;color:#555"> / ${TOTAL_KCAL}</span></div>
      <div class="ml">Calories today</div>
      <div class="mp"><div class="mf kcal-fill" style="width:${pctK}%"></div></div>
    </div>
  </div>
  <div class="day-actions">
    <button class="small-command" onclick="addExtraMeal()">+ Extra meal</button>
  </div>
  <div class="sec-lbl">${mealsDone}/${definitions.length} eaten · ${mealsModified} modified · ${mealsSkipped} skipped · ${today()}</div>
  ${mealsHTML}`;
}

function escapeAttr(value){
  return String(value||'').replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;');
}

function toggleMeal(id,date=today()){
  const d=mealsForDate(date);
  const entry=mealEntry(d[id]);
  entry.status=entry.status==='done'?'pending':'done';
  d[id]=entry;
  saveMealsForDate(date,d);
  render();
}

function setMealStatus(id,status,date=today()){
  const d=mealsForDate(date);
  const entry=mealEntry(d[id]);
  entry.status=status;
  d[id]=entry;
  saveMealsForDate(date,d);
  render();
}

function setMealNote(id,note,date=today()){
  const d=mealsForDate(date);
  const entry=mealEntry(d[id]);
  entry.note=note.trim();
  if((entry.note||entry.kcal||entry.items.length)&&entry.status==='pending')entry.status='modified';
  if(!entry.note&&!entry.kcal&&!entry.items.length&&entry.status==='modified')entry.status='pending';
  d[id]=entry;
  saveMealsForDate(date,d);
  render();
}

function setMealKcal(id,value,date=today()){
  const d=mealsForDate(date);
  const entry=mealEntry(d[id]);
  entry.kcal=Math.max(0,Number(value)||0);
  if((entry.note||entry.kcal||entry.items.length)&&entry.status==='pending')entry.status='modified';
  if(!entry.note&&!entry.kcal&&!entry.items.length&&entry.status==='modified')entry.status='pending';
  d[id]=entry;
  saveMealsForDate(date,d);
  render();
}

      <button class="weight-save-btn" onclick="doSaveWeight()">Save</button>

    <div style="font-size:11px;color:var(--muted);margin-top:4px">2-month goal: 90kg → 97kg, about +0.8kg/week.</div>
  </div>
  <div class="chart-card">
    <h4>Weight progress towards ${WEIGHT_GOAL}kg</h4>
    ${chartHTML}

async function doSaveWeight(){

  const date=document.getElementById('weightDate')?.value||today();
  if(!validRunDate(date)){showToast('Choose a valid measurement date.','error');return}
  saveWeight(date,val);
  render();
  const saved=await saveAllChanges();
  if(saved)showToast(`Weight saved : ${val} kg`,'success');
}

async function editWeight(date){
  const current=weights()[date];
  const value=prompt(`Edit weight for ${date.slice(8,10)}/${date.slice(5,7)}`,String(current));
  if(value===null)return;
  const val=parseFloat(value);
  if(!val||val<50||val>200){showToast('Enter a valid weight','error');return}
  saveWeight(date,val);

  const saved=await saveAllChanges();

async function deleteWeight(date){

  render();

  if(saved)showToast('Weight deleted','success');
}

function buildWeightChart(pts,w){
  if(pts.length<1)return`<div style="text-align:center;padding:20px;color:var(--muted);font-size:13px">No weights recorded</div>`;
  const allDates=Array.from(new Set([...WEEKS.map(wk=>wk.date),...Object.keys(w).filter(d=>w[d])])).sort();
  const values=Object.values(w).filter(Boolean);
  const minW=Math.floor(Math.min(88,WEIGHT_START,...values))-1;
  const maxW=Math.ceil(Math.max(98,WEIGHT_GOAL,...values))+1;
  const svgW=Math.max(560,allDates.length*58);
  const svgH=280;
  const pad={l:50,r:30,t:32,b:48};
  const cw=svgW-pad.l-pad.r;
  const ch=svgH-pad.t-pad.b;
  function px(i){return dateChartX(allDates[i],allDates,pad.l,cw)}
  function py(v){return pad.t+ch-(v-minW)/(maxW-minW)*ch}
  // target line
  const tStart=py(WEIGHT_START);
  const tEnd=py(WEIGHT_GOAL);
  const targetLine=`<line x1="${dateChartX(START_DATE,allDates,pad.l,cw)}" y1="${tStart}" x2="${dateChartX(GOAL_DATE,allDates,pad.l,cw)}" y2="${tEnd}" stroke="#f97316" stroke-width="2" stroke-dasharray="6,6" opacity=".65"/>`;
  // milestone lines
  const mLines=MILESTONES.map(m=>{
    const mi=allDates.findIndex(d=>d>=m.date);
    if(mi<0)return'';
    const x=px(mi),y=py(m.target);
    return `<circle cx="${x}" cy="${y}" r="4" fill="#f97316" opacity=".85"/>
    <text x="${x+7}" y="${y-7}" font-size="10" fill="#f97316" opacity=".9">${m.target}kg</text>`;
  }).join('');
  // actual data line
  let linePath='',dotHTML='';
  const dataPoints=allDates.map((d,i)=>({i,v:w[d]||null})).filter(p=>p.v);
  if(dataPoints.length>1){
    linePath=`<polyline points="${dataPoints.map(p=>`${px(p.i)},${py(p.v)}`).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
  }
  dotHTML=dataPoints.map(p=>`<circle cx="${px(p.i)}" cy="${py(p.v)}" r="6" fill="var(--accent)" stroke="var(--card)" stroke-width="2"/>
  <text x="${px(p.i)}" y="${py(p.v)-12}" text-anchor="middle" font-size="11" fill="var(--accent)" font-weight="800">${p.v}</text>`).join('');
  const averageLine=`<polyline points="${dataPoints.map(p=>`${px(p.i)},${py(rollingWeightAverage(w,allDates[p.i]))}`).join(' ')}" fill="none" stroke="var(--blue)" stroke-width="2"/>`;
  // y axis
  const yStep=Math.max(1,Math.ceil((maxW-minW)/5));
  const yValues=[];
  for(let v=minW;v<=maxW;v+=yStep)yValues.push(v);
  if(!yValues.includes(WEIGHT_GOAL))yValues.push(WEIGHT_GOAL);
  const yLabels=yValues.sort((a,b)=>a-b).map(v=>`<text x="${pad.l-8}" y="${py(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text><line x1="${pad.l}" y1="${py(v)}" x2="${pad.l+cw}" y2="${py(v)}" stroke="var(--border)" stroke-width="1"/>`).join('');
  const xLabels=allDates.filter((_,i)=>i%2===0||i===allDates.length-1).map(d=>{const i=allDates.indexOf(d);return`<text x="${px(i)}" y="${svgH-16}" text-anchor="middle" font-size="11" fill="var(--muted)">${d.slice(5)}</text>`}).join('');
  return`<div class="chart-wrap">
  <svg viewBox="0 0 ${svgW} ${svgH}" width="${svgW}" height="${svgH}" xmlns="http://www.w3.org/2000/svg" style="min-width:${svgW}px">
    ${yLabels}${xLabels}${targetLine}${mLines}${linePath}${averageLine}${dotHTML}
    <line x1="${pad.l}" y1="${pad.t}" x2="${pad.l}" y2="${pad.t+ch}" stroke="var(--border)" stroke-width="1"/>
    <line x1="${pad.l}" y1="${pad.t+ch}" x2="${pad.l+cw}" y2="${pad.t+ch}" stroke="var(--border)" stroke-width="1"/>
    <text x="${pad.l+cw}" y="${Math.max(12,tEnd-8)}" text-anchor="end" font-size="10" fill="#f97316" font-weight="800">${WEIGHT_GOAL}kg goal</text>
  </svg>
  <div style="font-size:11px;color:var(--muted);margin-top:8px;display:flex;gap:16px;flex-wrap:wrap">
    <span style="color:var(--accent)">● Actual weight</span><span style="color:var(--blue)">● 7-day average</span>
    <span style="color:var(--orange)">- - Target trajectory</span>
    <span style="color:var(--orange)">● Milestones</span>
  </div>
  </div>`;
}

// ── TRAINING ─────────────────────────────────────────
function renderTraining(){
  const day=new Date(`${trainingDate}T12:00:00`).getDay();
  const plan=TRAINING_PLAN[day]||TRAINING_PLAN[0];
  const date=trainingDate;
  const all=training();
  const state=all[date]||{done:{},notes:{},comment:''};
  state.notes=state.notes||{};
  const doneCount=plan.items.filter((_,i)=>state.done&&state.done[i]).length;
  const weekHTML=[1,2,3,4,5,6,0].map(dayNum=>{
    const p=TRAINING_PLAN[dayNum];
    const isToday=dayNum===day;
    const doneForToday=isToday?doneCount:null;

  document.getElementById('main').innerHTML=`

    ${date>today()?'<p class="training-meta">Future workout preview. Logging becomes available on the day.</p>':''}

    </fieldset>

  </div>

  if(s.includes('lateral raises'))return YOUTUBE_VIDEOS.lateralRaise;
  if(s.includes('lateral crunch'))return YOUTUBE_VIDEOS.lateralCrunch;
  if(s.includes('lateral planks'))return YOUTUBE_VIDEOS.sidePlank;
  if(s.includes('plank'))return YOUTUBE_VIDEOS.plank;
  if(s.includes('crunch'))return YOUTUBE_VIDEOS.crunch;
  if(s.includes('cardio')||s.includes('5k'))return YOUTUBE_VIDEOS.running;
  if(s.trim()==='abs')return YOUTUBE_VIDEOS.abs;
  if(s.includes('stretching')||s.includes('stretching')||s.includes('active recovery')||s.includes('light mobility'))return YOUTUBE_VIDEOS.mobility;

  if(s.includes('ez bar curl'))return YOUTUBE_VIDEOS.ezCurl;
  if(s.includes('dumbbell shrugs'))return YOUTUBE_VIDEOS.shrugs;
  if(s.includes('alternating dumbbell curl'))return YOUTUBE_VIDEOS.alternatingCurl;
  if(s.includes('leg and hip warm-up'))return YOUTUBE_VIDEOS.hipWarmup;
  if(s.includes('hanging leg raises')||s.includes('leg raises/knee raises'))return YOUTUBE_VIDEOS.hangingLegRaise;
  if(s.includes('pull ups')||s.includes('pull-ups'))return YOUTUBE_VIDEOS.pullUp;
  if(s.includes('dips'))return YOUTUBE_VIDEOS.dips;
  if(s.includes('upright row close grip'))return YOUTUBE_VIDEOS.closeGripUprightRow;
  if(s.includes('upright row wide grip'))return YOUTUBE_VIDEOS.wideGripUprightRow;
  if(s.includes('seated cable row'))return YOUTUBE_VIDEOS.seatedCableRow;
  if(s.includes('rope triceps extensions'))return YOUTUBE_VIDEOS.ropeTriceps;

  return null;

function openExerciseVideo(event,item){

  const modal=document.createElement('div');
  modal.className='video-modal';

function escapeText(value){

function validRunDate(date){
  return /^\d{4}-\d{2}-\d{2}$/.test(date)&&!Number.isNaN(new Date(`${date}T12:00:00`).getTime())&&new Date(`${date}T12:00:00`).toISOString().slice(0,10)===date&&date<=today();
}
function selectTrainingDate(date){
  if(!validCalendarDate(date)){showToast('Choose a valid date.','error');return}
  trainingDate=date;
  renderTraining();
}
function parseRunTime(value){
  const match=/^(\d{1,3}):([0-5]\d)$/.exec(String(value).trim());
  return match&&Number(match[1])*60+Number(match[2])>0?Number(match[1])*60+Number(match[2]):null;
}
function formatRunTime(seconds){return `${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`}
function runForm(date,withDate=false){
  const seconds=training()[date]?.runSeconds;
  return `<form onsubmit="event.preventDefault();saveRunTime(${withDate?"document.getElementById('runDate').value":`'${date}'`},document.getElementById('runTime').value)">
    ${withDate?`<label for="runDate">Run date</label><input class="exercise-note" id="runDate" type="date" max="${today()}" value="${date}" required onchange="loadRunTime(this.value)">`:''}
    <label for="runTime">5K finish time (minutes:seconds)</label>
    <input class="exercise-note" id="runTime" type="text" inputmode="text" placeholder="25:30" pattern="[0-9]{1,3}:[0-5][0-9]" value="${seconds?formatRunTime(seconds):''}" required>
    <div class="field-grid"><label>Route (optional)<input class="exercise-note" id="runRoute" value="${escapeAttr(training()[date]?.runDetails?.route||'')}" maxlength="200"></label><label>Effort (optional)<select class="exercise-note" id="runEffort"><option value="">Not recorded</option>${['Easy','Moderate','Hard','All-out'].map(v=>`<option ${training()[date]?.runDetails?.effort===v?'selected':''}>${v}</option>`).join('')}</select></label><label>Surface (optional)<select class="exercise-note" id="runSurface"><option value="">Not recorded</option>${['Outdoor','Treadmill'].map(v=>`<option ${training()[date]?.runDetails?.surface===v?'selected':''}>${v}</option>`).join('')}</select></label></div>
    <button class="small-command" type="submit">Save run time</button>
    <p class="training-meta">One result per date. Saving again updates that day's time.</p>
  </form>`;
}
function loadRunTime(date){
  const seconds=training()[date]?.runSeconds;
  document.getElementById('runTime').value=seconds?formatRunTime(seconds):'';
  for(const [id,key] of [['runRoute','route'],['runEffort','effort'],['runSurface','surface']])document.getElementById(id).value=training()[date]?.runDetails?.[key]||'';
}
function saveRunTime(date,value){
  const seconds=parseRunTime(value);
  if(!validRunDate(date)||seconds===null){showToast('Enter a valid date and a time such as 25:30.','error');return false}
  const all=training();
  const state=all[date]||{done:{},notes:{},comment:''};
  state.runSeconds=seconds;
  if(document.getElementById('runRoute')?.value!==undefined)state.runDetails={route:document.getElementById('runRoute').value.trim(),effort:document.getElementById('runEffort').value,surface:document.getElementById('runSurface').value};
  if(new Date(`${date}T12:00:00`).getDay()===2)state.done={...state.done,0:true};
  all[date]=state;
  saveTraining(all,date);
  render();
  showToast('Run time saved on this device. Syncing automatically.');
  return true;
}
function deleteRunTime(date){
  if(!confirm(`Delete the 5K time for ${date}?`))return;
  const all=training();
  if(!all[date])return;
  delete all[date].runSeconds;
  delete all[date].runDetails;
  saveTraining(all,date);
  render();
}
function editRunTime(date){
  document.getElementById('runDate').value=date;
  loadRunTime(date);
  document.getElementById('runTime').focus();
}

  document.getElementById('main').innerHTML=`<div class="training-day"><h3>🏃 5K Runs</h3><p class="training-meta">Log your finish times and follow your progress.</p>${runForm(today(),true)}</div>

    <div class="history-stat"><strong>${latest?formatRunTime(latest):'—'}</strong><span>Latest time</span></div>
    <div class="history-stat"><strong>${change===null?'—':formatRunTime(Math.abs(change))}</strong><span>${change===null?'Change since first run':change<0?'Faster since first run':change>0?'Slower since first run':'Same as first run'}</span></div></div></div>
    <div class="history-card"><h3>5K finish times</h3>${runChart(runs)}<p class="training-meta">Lower is faster. ★ marks your personal best. Average of last 5 runs: ${runs.length?formatRunTime(Math.round(runs.slice(-5).reduce((sum,[,v])=>sum+v.runSeconds,0)/Math.min(5,runs.length))):'—'}</p></div>
    <div class="history-card" style="overflow-x:auto"><table class="weight-table"><thead><tr><th>Date</th><th>Time</th><th>Pace</th><th>Vs previous</th><th>Actions</th></tr></thead><tbody>${rows}</tbody></table>${runs.length?'':'<p class="training-meta">No 5K runs recorded yet. Add your first time above.</p>'}</div>`;

function buildCaloriesChart(points){
  if(!points.length)return`<div style="text-align:center;padding:20px;color:var(--muted);font-size:13px">No calories recorded yet</div>`;
  const sorted=[...points].sort((a,b)=>a.date>b.date?1:-1);
  const maxKcal=Math.max(TOTAL_KCAL, ...sorted.map(p=>p.kcal), 1000);
  const svgW=Math.max(560,sorted.length*64);
  const svgH=250;
  const pad={l:50,r:24,t:26,b:48};
  const cw=svgW-pad.l-pad.r;
  const ch=svgH-pad.t-pad.b;
  const barW=Math.max(18,Math.min(34,cw/sorted.length*.48));
  function px(i){return sorted.length===1?pad.l+cw/2:pad.l+i*(cw/(sorted.length-1))}
  function py(v){return pad.t+ch-(v/maxKcal)*ch}
  const yValues=[0,Math.round(maxKcal*.25),Math.round(maxKcal*.5),Math.round(maxKcal*.75),Math.round(maxKcal)];
  const yLabels=yValues.map(v=>`<text x="${pad.l-8}" y="${py(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text><line x1="${pad.l}" y1="${py(v)}" x2="${pad.l+cw}" y2="${py(v)}" stroke="var(--border)" stroke-width="1"/>`).join('');
  const bars=sorted.map((p,i)=>{
    const x=px(i)-barW/2;
    const y=py(p.kcal);
    const h=pad.t+ch-y;
    const ok=p.kcal>=TOTAL_KCAL;
    return `<rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="6" fill="${ok?'var(--accent)':'var(--orange)'}" opacity=".72"/>
    <circle cx="${px(i)}" cy="${y}" r="4" fill="${ok?'var(--accent)':'var(--orange)'}"/>
    <text x="${px(i)}" y="${Math.max(12,y-8)}" text-anchor="middle" font-size="10" fill="${ok?'var(--accent)':'var(--orange)'}" font-weight="800">${p.kcal}</text>`;
  }).join('');
  const line=sorted.length>1
    ? `<polyline points="${sorted.map((p,i)=>`${px(i)},${py(p.kcal)}`).join(' ')}" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".45"/>`
    : '';
  const targetY=py(TOTAL_KCAL);
  const targetLine=`<line x1="${pad.l}" y1="${targetY}" x2="${pad.l+cw}" y2="${targetY}" stroke="var(--blue)" stroke-width="2" stroke-dasharray="6,6" opacity=".75"/>
  <text x="${pad.l+cw}" y="${Math.max(12,targetY-8)}" text-anchor="end" font-size="10" fill="var(--blue)" font-weight="800">${TOTAL_KCAL} kcal goal</text>`;
  const xLabels=sorted.map((p,i)=>`<text x="${px(i)}" y="${svgH-18}" text-anchor="middle" font-size="11" fill="var(--muted)">${p.date.slice(5)}</text>`).join('');
  return`<div class="chart-wrap">
  <svg viewBox="0 0 ${svgW} ${svgH}" width="${svgW}" height="${svgH}" xmlns="http://www.w3.org/2000/svg" style="min-width:${svgW}px">
    ${yLabels}${targetLine}${bars}${line}${xLabels}
    <line x1="${pad.l}" y1="${pad.t}" x2="${pad.l}" y2="${pad.t+ch}" stroke="var(--border)" stroke-width="1"/>
    <line x1="${pad.l}" y1="${pad.t+ch}" x2="${pad.l+cw}" y2="${pad.t+ch}" stroke="var(--border)" stroke-width="1"/>
  </svg>
  <div style="font-size:11px;color:var(--muted);margin-top:8px;display:flex;gap:16px;flex-wrap:wrap">
    <span style="color:var(--accent)">● Goal reached</span>
    <span style="color:var(--orange)">● Below goal</span>
    <span style="color:var(--blue)">- - Daily goal</span>
  </div>
  </div>`;
}

function sevenDayCalorieStats(allMeals){
  let total=0;
  let tracked=0;
  const anchor=new Date(`${today()}T12:00:00`);
  for(let offset=0;offset<7;offset++){
    const value=new Date(anchor);
    value.setDate(anchor.getDate()-offset);
    const date=value.toISOString().slice(0,10);
    const day=allMeals[date]||{};
    let dayKcal=0;
    let hasCalorieLog=false;
    mealDefinitions(day).forEach(meal=>{
      const entry=mealEntry(day[meal.id]);
      if(entry.status!=='pending'||entry.items.length||entry.kcal>0){
        hasCalorieLog=true;
        dayKcal+=mealCalories(entry,meal);
      }
    });
    if(hasCalorieLog){
      tracked++;
      total+=dayKcal;
    }
  }
  const average=tracked?Math.round(total/tracked):0;
  return {average,tracked,total,delta:average-TOTAL_KCAL};
}

function renderHistory(){
  const allMeals=cloudReady?(cloudState.meals||{}):collectLocalMeals();
  const allTraining=training();
  const weekly=sevenDayCalorieStats(allMeals);
  const weeklyPct=weekly.tracked?Math.min(100,Math.round(weekly.average/TOTAL_KCAL*100)):0;
  const weeklyDeltaText=!weekly.tracked
    ? 'No calorie entries yet'
    : Math.abs(weekly.delta)<=200
      ? 'Within target range'
      : `${Math.abs(weekly.delta)} kcal ${weekly.delta<0?'below':'above'} the goal`;
  const dates=Array.from(new Set([...Object.keys(allMeals),...Object.keys(allTraining)])).sort().reverse();
  let totalKcal=0,doneMeals=0,skippedMeals=0,modifiedMeals=0,notesCount=0,trainingDays=0,doneExercises=0,trackedDays=0;
  const calorieChartData=[];
  const daysHTML=dates.map(date=>{
    const dayMeals=allMeals[date]||{};
    let dayKcal=0,dayDone=0,daySkipped=0,dayModified=0;
    const mealLines=mealDefinitions(dayMeals).map(meal=>{
      const entry=mealEntry(dayMeals[meal.id]);
      const hasMealLog=entry.status!=='pending'||entry.note||entry.kcal>0||entry.items.length;
      if(!hasMealLog)return'';
      const kcalValue=mealCalories(entry,meal);
      totalKcal+=kcalValue;
      dayKcal+=kcalValue;
      if(entry.status==='done'){
        doneMeals++;
        dayDone++;
      }
      if(entry.status==='skipped'){
        skippedMeals++;
        daySkipped++;
      }
      if(entry.status==='modified'){
        modifiedMeals++;
        dayModified++;
      }
      if(entry.note)notesCount++;
      const status=entry.status==='done'?'Eaten':entry.status==='skipped'?'Skipped':entry.status==='modified'?'Modified':'Note';
      const kcal=entry.status==='skipped'?'':` · ${kcalValue} kcal`;
      const foods=entry.items.length?`<span class="history-note">${entry.items.map(item=>`${escapeText(BASE_FOODS.find(food=>food.id===item.foodId)?.name||item.name)} ${item.qty}${escapeText(BASE_FOODS.find(food=>food.id===item.foodId)?.unit||item.unit)} (${itemCalories(item)} kcal)`).join(' · ')}</span>`:'';
      const note=entry.note?`<span class="history-note">${escapeText(entry.note)}</span>`:'';
      const editKey=`${date}:${meal.id}`;
      const editor=historyEditKey===editKey?renderHistoryMealEditor(date,meal,entry):'';
      return `<div class="history-line">${meal.time} · ${escapeText(meal.name)} · ${status}${kcal}${foods}${note}
        <div class="history-actions">
          <button class="small-command" onclick="toggleHistoryEdit('${date}','${meal.id}')">${historyEditKey===editKey?'Close':'Edit'}</button>
          <button class="small-command" onclick="resumeMeal('${date}','${meal.id}')">Use today</button>
          <button class="small-command" onclick="deleteHistoryMeal('${date}','${meal.id}')">Delete</button>
        </div>${editor}</div>`;
    }).join('');
    const session=allTraining[date];
    let trainingLines='';
    if(session){
      const dayNum=new Date(`${date}T12:00:00`).getDay();
      const plan=TRAINING_PLAN[dayNum]||TRAINING_PLAN[0];
      const historyItems=dayNum===2?['5K Run','Abs (previous plan)','Mobility stretching (previous plan)']:plan.items;
      const checked=Object.entries(session.done||{}).filter(([,v])=>v).map(([i])=>Number(i));
      const exerciseNotes=Object.entries(session.notes||{}).filter(([,note])=>String(note||'').trim());
      const loggedExercises=Array.from(new Set([...checked,...exerciseNotes.map(([i])=>Number(i))])).sort((a,b)=>a-b);
      if(loggedExercises.length||session.comment||session.runSeconds||Object.keys(session.strength||{}).length||Object.values(session.rounds||{}).some(Boolean)){
        trainingDays++;
        doneExercises+=checked.length;

function shiftedDate(date,days){const d=new Date(`${date}T12:00:00Z`);d.setUTCDate(d.getUTCDate()+days);return d.toISOString().slice(0,10)}

function dateChartX(date,dates,left,width){
  const first=Date.parse(dates[0]),last=Date.parse(dates.at(-1));
  return first===last?left+width/2:left+(Date.parse(date)-first)/(last-first)*width;
}
function rollingWeightAverage(w,date){
  const start=shiftedDate(date,-6),values=Object.entries(w).filter(([d,v])=>d>=start&&d<=date&&Number.isFinite(v)&&v>0).map(([,v])=>v);
  return values.length?values.reduce((a,b)=>a+b,0)/values.length:0;
}
function runChart(runs){
  if(!runs.length)return '<p class="training-meta">Add your first run to start the chart.</p>';
  const dates=runs.map(([d])=>d),times=runs.map(([,v])=>v.runSeconds),min=Math.min(...times),max=Math.max(...times);
  const bottom=Math.max(0,min-30),top=max+30;
  const x=d=>dateChartX(d,dates,65,590),y=v=>210-(v-bottom)/(top-bottom)*160;
  return `<div class="chart-wrap"><svg role="img" aria-label="5K finish times by date; exact times are in the table below" viewBox="0 0 720 260" style="width:100%;min-width:480px"><line x1="65" y1="210" x2="655" y2="210" stroke="var(--border)"/>${[bottom,(bottom+top)/2,top].map(v=>`<text x="5" y="${y(v)}" fill="var(--muted)" font-size="12">${formatRunTime(Math.round(v))}</text><line x1="65" y1="${y(v)}" x2="655" y2="${y(v)}" stroke="var(--border)"/>`).join('')}<polyline fill="none" stroke="var(--accent)" stroke-width="3" points="${runs.map(([d,v])=>`${x(d)},${y(v.runSeconds)}`).join(' ')}"/>${runs.map(([d,v],i)=>`<circle cx="${x(d)}" cy="${y(v.runSeconds)}" r="5" fill="${v.runSeconds===min?'var(--orange)':'var(--accent)'}"><title>${d}: ${formatRunTime(v.runSeconds)}</title></circle>${v.runSeconds===min?`<text x="${x(d)}" y="${y(v.runSeconds)-12}" text-anchor="middle" fill="var(--orange)">★</text>`:''}${i===0||i===runs.length-1?`<text x="${x(d)}" y="240" text-anchor="middle" fill="var(--muted)" font-size="12">${d}</text>`:''}`).join('')}</svg></div>`;
}

const INTERVAL_STAGES=[{name:'Warm-up',seconds:480,speed:'8–9 km/h'},...Array.from({length:6},(_,i)=>[{name:`Fast interval ${i+1}/6`,seconds:120,speed:'12 km/h'},...(i<5?[{name:`Recovery ${i+1}/5`,seconds:90,speed:'8–9 km/h'}]:[])]).flat(),{name:'Cool-down',seconds:300,speed:'Easy pace'}];
const INTERVAL_TOTAL=INTERVAL_STAGES.reduce((sum,s)=>sum+s.seconds,0);
let intervalState=ls(`${STORAGE_PREFIX}_interval_timer`)||{elapsed:0,started:null,sound:false};
let intervalAudio=null,lastTimerStage=-1;
function intervalElapsed(now=Date.now()){return Math.min(INTERVAL_TOTAL,intervalState.elapsed+(intervalState.started===null?0:(now-intervalState.started)/1000))}
function intervalPosition(elapsed){let offset=0;for(let i=0;i<INTERVAL_STAGES.length;i++){const stage=INTERVAL_STAGES[i];if(elapsed<offset+stage.seconds)return {index:i,...stage,remaining:Math.ceil(offset+stage.seconds-elapsed)};offset+=stage.seconds}return {index:INTERVAL_STAGES.length,name:'Session complete',speed:'32:30 completed',remaining:0}}
function persistInterval(){ss(`${STORAGE_PREFIX}_interval_timer`,intervalState)}
function intervalTimerHTML(){const phase=intervalPosition(intervalElapsed());return `<div class="history-card"><h3>Saturday interval timer</h3><p class="training-meta">32:30 total · 6 fast intervals · 5 recoveries. Keep this page open for cues.</p><div id="intervalPhase" role="status">${phase.name} · ${phase.speed}</div><div class="timer-clock" id="intervalClock">${formatRunTime(phase.remaining)}</div><div class="day-actions"><button class="small-command" id="intervalToggle" onclick="toggleInterval()">${intervalState.started===null?'Start / Resume':'Pause'}</button><button class="small-command" onclick="resetInterval()">Reset</button><label><input type="checkbox" ${intervalState.sound?'checked':''} onchange="setIntervalSound(this.checked)"> Sound cues</label></div></div>`}
function setIntervalSound(value){intervalState.sound=value;persistInterval();if(value){const Audio=window.AudioContext||window.webkitAudioContext;if(Audio&&!intervalAudio)intervalAudio=new Audio();intervalAudio?.resume().catch(()=>{});intervalCue()}}
function intervalCue(){if(!intervalState.sound||!intervalAudio)return;try{const oscillator=intervalAudio.createOscillator(),gain=intervalAudio.createGain();gain.gain.value=.12;oscillator.connect(gain);gain.connect(intervalAudio.destination);oscillator.start();oscillator.stop(intervalAudio.currentTime+.2)}catch{}}
function toggleInterval(){if(intervalState.started!==null){intervalState.elapsed=intervalElapsed();intervalState.started=null}else{if(intervalState.elapsed>=INTERVAL_TOTAL)intervalState.elapsed=0;intervalState.started=Date.now();if(intervalState.sound)setIntervalSound(true)}persistInterval();updateInterval()}
function resetInterval(){if(!confirm('Reset the interval timer?'))return;intervalState={elapsed:0,started:null,sound:intervalState.sound};lastTimerStage=-1;persistInterval();updateInterval()}
function updateInterval(){const elapsed=intervalElapsed(),phase=intervalPosition(elapsed);if(phase.index!==lastTimerStage){if(lastTimerStage>=0&&intervalState.started!==null)intervalCue();lastTimerStage=phase.index}if(elapsed>=INTERVAL_TOTAL&&intervalState.started!==null){intervalState.elapsed=INTERVAL_TOTAL;intervalState.started=null;persistInterval()}const clock=document.getElementById('intervalClock'),label=document.getElementById('intervalPhase'),button=document.getElementById('intervalToggle');if(clock)clock.textContent=formatRunTime(phase.remaining);if(label)label.textContent=`${phase.name} · ${phase.speed}`;if(button)button.textContent=intervalState.started===null?'Start / Resume':'Pause'}
setInterval(updateInterval,250);

async function prepareAiPhoto(file){
  if(!file||!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('Choose a JPEG, PNG or WebP photo. Export HEIC photos as JPEG first.');
  if(file.size>12*1024*1024)throw new Error('Choose a photo smaller than 12 MB.');
  const url=URL.createObjectURL(file);
  try{
    const img=new Image();
    await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(new Error('This photo could not be opened. Try another image.'));img.src=url;});
    if(!img.naturalWidth||!img.naturalHeight)throw new Error('This photo is empty.');
    const scale=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));
    const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
    const context=canvas.getContext('2d');context.fillStyle='#fff';context.fillRect(0,0,canvas.width,canvas.height);context.drawImage(img,0,0,canvas.width,canvas.height);
    const image=canvas.toDataURL('image/jpeg',.85);
    if(image.length>2666660)throw new Error('Photo is too large after resizing. Crop it or choose a smaller image.');
    return image;
  }finally{URL.revokeObjectURL(url);}
}
async function selectAiPhoto(date,id,file){
  if(!file)return;
  const key=aiMealKey(date,id),revision=(aiMeals[key]?.photoRevision||0)+1;
  aiMeals[key]={...aiMeals[key],open:true,photoLoading:true,photoRevision:revision,result:null,error:'',image:undefined};render();
  try{const image=await prepareAiPhoto(file);if(aiMeals[key]?.photoRevision===revision)aiMeals[key].image=image;}
  catch(error){if(aiMeals[key]?.photoRevision===revision)aiMeals[key].error=error.message;}
  finally{if(aiMeals[key]?.photoRevision===revision)aiMeals[key].photoLoading=false;render();}
}
function removeAiPhoto(date,id){const key=aiMealKey(date,id);aiMeals[key]={...aiMeals[key],image:undefined,result:null,photoLoading:false,photoRevision:(aiMeals[key]?.photoRevision||0)+1};render()}

function rememberAiPanel(date,id,open){const key=aiMealKey(date,id);aiMeals[key]={...aiMeals[key],open}}
function setAiDescription(date,id,description){const key=aiMealKey(date,id);aiMeals[key]={...aiMeals[key],description,open:true,result:null,error:''}}
function aiEstimateTotal(items){return items.reduce((sum,item)=>sum+Math.round(item.grams*item.kcalPer100g/100),0)}
async function estimateMeal(date,id){
  const key=aiMealKey(date,id),draft=aiMeals[key]||{};
  if(draft.loading||draft.photoLoading)return;
  if(!aiAccessCode){aiMeals[key]={...draft,open:true,error:'Enter your AI access code.'};render();return}
  if(!draft.image&&(draft.description||'').trim().length<5){aiMeals[key]={...draft,open:true,error:'Describe the foods and portions you ate.'};render();return}
  const description=draft.description||'',image=draft.image;
  aiMeals[key]={...draft,open:true,loading:true,error:'',result:null};render();
  try{
    const response=await fetch('/api/estimate-meal',{method:'POST',headers:{'content-type':'application/json','x-ai-access-code':aiAccessCode},body:JSON.stringify({description,...(image?{image}:{})})});
    const result=await response.json();
    if(!response.ok)throw new Error(result.error||'Could not estimate this meal.');
    if((aiMeals[key].description||'')===description&&aiMeals[key].image===image)aiMeals[key].result=result;
    else aiMeals[key].error='Your photo or description changed. Estimate again to use the updated meal.';
  }catch(error){aiMeals[key].error=error.message||'Could not connect. Please try again.';}
  finally{aiMeals[key].loading=false;render();}
}
function editAiIngredient(date,id,index,field,value){
  const item=aiMeals[aiMealKey(date,id)]?.result?.items[index];if(!item)return;
  if(field==='name'){if(!value.trim())return;item.name=value.trim();}
  else if(['grams','kcalPer100g'].includes(field)){const n=Number(value);if(value===''||!Number.isFinite(n)||n<(field==='grams'?0.1:0)||n>(field==='grams'?10000:1000)){showToast('Enter a valid ingredient quantity or calorie value.','error');render();return}item[field]=n;}
  render();
}
function removeAiIngredient(date,id,index){aiMeals[aiMealKey(date,id)].result.items.splice(index,1);render()}
function saveAiMeal(date,id){
  const key=aiMealKey(date,id),draft=aiMeals[key];if(!draft?.result?.items.length||draft.loading)return;
  const day=mealsForDate(date),entry=mealEntry(day[id]);
  if((entry.items.length||entry.kcal||entry.status==='done')&&!confirm('Replace this meal’s existing foods and calories with the reviewed estimate?'))return;
  entry.items=draft.result.items.map((item,i)=>({id:`ai-${Date.now()}-${i}`,name:item.name,unit:'g',base:100,kcal:item.kcalPer100g,qty:item.grams,source:'ai'}));
  entry.status='modified';entry.kcal=0;
  entry.note=[entry.note,`AI estimate: ${draft.description||'Meal photo'}${draft.image?' (photo supplied)':''}`,draft.result.assumptions].filter(Boolean).join('\n');
  day[id]=entry;saveMealsForDate(date,day);delete aiMeals[key];render();showToast('Reviewed estimate added to your meal.');
}

  else syncNow();
});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible')return;
  if(Object.keys(pendingChanges).length)saveAllChanges();
  else syncNow({quiet:true});
});
setInterval(()=>{
  const editing=document.activeElement?.matches('input, textarea, select');
  const hasPending=Object.keys(pendingChanges).length>0;
  if(document.visibilityState!=='visible'||editing)return;
  if(hasPending)saveAllChanges();
  else syncNow({quiet:true});
},30000);
</script>
</body>
</html>
