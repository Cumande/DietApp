<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cee's Diet & Gym plan</title>
<style>
:root{--bg:#0a0a0a;--card:#141414;--surface:#1c1c1c;--surface2:#101010;--accent:#22c55e;--accent2:#4ade80;--orange:#f97316;--blue:#3b82f6;--red:#ef4444;--text:#f0f0f0;--muted:#666;--soft:#555;--border:#1e1e1e;--header:rgba(10,10,10,.96);--done-bg:#0a1a0a;--skip-bg:#190b0b}
body.light{--bg:#f6f7f4;--card:#fff;--surface:#f0f2ed;--surface2:#fafbf8;--text:#111827;--muted:#6b7280;--soft:#4b5563;--border:#dfe3d8;--header:rgba(246,247,244,.96);--done-bg:#eaf8ee;--skip-bg:#fff0f0}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
/* HEADER */
.header{background:var(--header);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:14px 16px;position:sticky;top:0;z-index:50}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.header h1{font-size:18px;font-weight:800;line-height:1.15}
.goal-badge{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;padding:5px 11px;border-radius:20px;font-size:11px;font-weight:700}
.icon-badge{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:5px 9px;border-radius:20px;font-size:12px;font-weight:800;cursor:pointer}
.tabs{display:flex;gap:6px}
.tab{flex:1;padding:8px;border-radius:12px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:12px;font-weight:700;transition:all .18s;text-align:center}
.tab.active{background:var(--accent);border-color:var(--accent);color:#000}
/* MAIN */
.main{max-width:760px;margin:0 auto;padding:16px 14px 100px}
/* PROGRESS RING */
.hero-progress{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px}
.ring-wrap{position:relative;width:80px;height:80px;flex-shrink:0}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:#1e1e1e;stroke-width:8}
.ring-fill{fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:var(--accent)}
.ring-sub{font-size:9px;color:var(--muted);font-weight:600}
.hero-info{flex:1}
.hero-info h2{font-size:15px;font-weight:800;margin-bottom:4px}
.hero-info p{font-size:12px;color:var(--muted);line-height:1.6}
.hero-info .milestone{font-size:12px;color:var(--orange);margin-top:4px;font-weight:600}
/* MACRO BAR */
.macro-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.macro-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.macro-card .mv{font-size:22px;font-weight:800}
.macro-card .ml{font-size:10px;color:var(--muted);margin-top:2px}
.macro-card .mp{height:4px;background:#1e1e1e;border-radius:2px;margin-top:8px;overflow:hidden}
.macro-card .mf{height:100%;border-radius:2px;transition:width .4s}
.kcal-fill{background:linear-gradient(90deg,var(--orange),#fbbf24)}
.prot-fill{background:linear-gradient(90deg,var(--blue),#60a5fa)}
/* MEAL CARDS */
.sec-lbl{font-size:9px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.meal-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:8px;display:flex;align-items:center;gap:14px;transition:all .2s;cursor:pointer}
.meal-card.checked{border-color:#14532d;background:var(--done-bg)}
.meal-card.skipped{border-color:#4a1d1d;background:var(--skip-bg)}
.meal-check{width:36px;height:36px;border-radius:10px;border:2px solid #2a2a2a;background:transparent;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .2s;cursor:pointer}
.meal-check.on{background:var(--accent);border-color:var(--accent)}
.meal-check.skip{background:#ef4444;border-color:#ef4444;color:#fff}
.meal-body{flex:1;min-width:0}
.meal-time{font-size:10px;color:var(--muted);font-weight:700;margin-bottom:3px}
.meal-name{font-size:13px;font-weight:700;margin-bottom:4px;line-height:1.3}
.meal-desc{font-size:11px;color:var(--soft);line-height:1.4}
.meal-macros{display:flex;gap:8px;margin-top:6px}
.meal-chip{padding:2px 7px;border-radius:6px;font-size:10px;font-weight:700}
.mc-kcal{background:#2a1500;color:#fb923c}
.mc-prot{background:#0a1525;color:#60a5fa}
.meal-actions{display:flex;gap:8px;margin-top:10px}
.meal-action{border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:8px;padding:7px 9px;font-size:11px;font-weight:800;cursor:pointer}
.meal-action.done.on{background:var(--accent);border-color:var(--accent);color:#000}
.meal-action.skip.on{background:#ef4444;border-color:#ef4444;color:#fff}
.meal-note{width:100%;margin-top:8px;padding:9px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px}
.meal-note:focus{outline:none;border-color:var(--accent)}
/* WEIGHT PAGE */
.weight-input-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px}
.weight-input-card h3{font-size:14px;font-weight:800;margin-bottom:14px}
.weight-input-row{display:flex;gap:10px;align-items:center}
.weight-input{flex:1;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:20px;font-weight:800;text-align:center}
.weight-input:focus{outline:none;border-color:var(--accent)}
.weight-save-btn{padding:12px 20px;border-radius:10px;border:none;background:var(--accent);color:#000;font-size:13px;font-weight:800;cursor:pointer}
/* WEIGHT CHART */
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
.chart-card h4{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:14px}
.chart-wrap{overflow-x:auto}
/* WEIGHT TABLE */
.weight-table{width:100%;border-collapse:collapse;font-size:12px}
.weight-table th{text-align:left;padding:6px 8px;color:#444;font-size:10px;letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid var(--border)}
.weight-table td{padding:9px 8px;border-bottom:1px solid #111;color:#ccc}
.weight-table tr.current td{color:var(--accent);font-weight:700}
.weight-table tr.past td{color:#555}
.delta-pos{color:var(--accent)}
.delta-neg{color:#ef4444}
/* RULES */
.rules{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-top:8px}
.rules h4{font-size:9px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#333;margin-bottom:10px}
.rule{font-size:12px;padding:5px 0;border-bottom:1px solid #111;color:#777}
.rule:last-child{border:none}
/* TRAINING */
.training-day{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px}
.training-day h3{font-size:15px;font-weight:800;margin-bottom:4px}
.training-meta{font-size:11px;color:var(--muted);margin-bottom:10px}
.exercise-row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border)}
.exercise-row:last-child{border-bottom:none}
.exercise-check{width:28px;height:28px;border-radius:8px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;font-weight:800}
.exercise-check.on{background:var(--accent);border-color:var(--accent);color:#000}
.exercise-text{font-size:12px;color:var(--text);line-height:1.45}
.exercise-text.done-text{text-decoration:line-through;color:var(--muted)}
.session-comment{width:100%;min-height:110px;resize:vertical;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:12px;font-size:13px;line-height:1.5}
.session-comment:focus{outline:none;border-color:var(--accent)}
.week-grid{display:grid;grid-template-columns:1fr;gap:8px}
.week-day{border:1px solid var(--border);background:var(--surface2);border-radius:10px;padding:10px}
.week-day.today{border-color:var(--accent);background:var(--done-bg)}
.week-day summary{list-style:none;cursor:pointer}
.week-day summary::-webkit-details-marker{display:none}
.week-day-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.week-day-name{font-size:12px;font-weight:800;color:var(--text)}
.week-day-progress{font-size:10px;font-weight:800;color:var(--accent)}
.week-day-type{font-size:11px;color:var(--muted);line-height:1.35}
.week-exercises{margin-top:10px;padding-top:8px;border-top:1px solid var(--border);display:grid;gap:7px}
.week-exercise{display:flex;gap:8px;align-items:flex-start;font-size:11px;color:var(--soft);line-height:1.35}
.exercise-illus{width:28px;height:28px;border-radius:8px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px}
/* HISTORY */
.history-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px}
.history-card h3{font-size:15px;font-weight:800;margin-bottom:4px}
.history-summary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.history-stat{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px}
.history-stat strong{display:block;font-size:18px;color:var(--accent);margin-bottom:2px}
.history-stat span{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase}
.history-date{font-size:13px;font-weight:800;margin-bottom:8px;color:var(--text)}
.history-line{font-size:12px;color:var(--soft);line-height:1.45;padding:5px 0;border-bottom:1px solid var(--border)}
.history-line:last-child{border-bottom:none}
.history-note{display:block;color:var(--muted);font-size:11px;margin-top:2px}
</style>
</head>
<body>
<div class="header">
  <div class="header-top">
    <h1>Cee's Diet & Gym plan</h1>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="icon-badge" id="themeToggle" onclick="toggleTheme()">🌙</button>
      <span class="goal-badge" id="cloudStatus" onclick="setPin()">📱 Local</span>
      <span class="goal-badge">🎯 97kg · 22 oct.</span>
    </div>
  </div>
  <div class="tabs">
    <button class="tab active" id="tab0" onclick="switchTab(0)">📋 Aujourd'hui</button>
    <button class="tab" id="tab1" onclick="switchTab(1)">🏋️ Training</button>
    <button class="tab" id="tab2" onclick="switchTab(2)">⚖️ Poids</button>
    <button class="tab" id="tab3" onclick="switchTab(3)">📊 Historique</button>
  </div>
</div>
<div class="main" id="main"></div>

<script>
// ═══════════════════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════════════════
const MEALS = [

  {id:'m3',time:'12:30',emoji:'🍚',name:'Lunch',desc:'Riz cuit 250g · Poulet 250g ou bœuf maigre · Légumes · 1 càs huile olive',kcal:1150,prot:50},
  {id:'m4',time:'15:30',emoji:'🍞',name:'Snack',desc:'Yaourt grec 250g · Pain complet 4 tranches · Beurre de cac 60g · 1 pomme',kcal:900,prot:40},
  {id:'m5',time:'18:30',emoji:'🍝',name:'Dinner',desc:'Pâtes ou riz cuits 250g · Poulet 250g ou bœuf maigre · Légumes · 1 càs huile olive',kcal:1150,prot:50},
  {id:'m6',time:'21:00',emoji:'💪',name:'Gainer 2 — Hard Mass Harder',desc:'130g de poudre',kcal:500,prot:20}

const TOTAL_KCAL = MEALS.reduce((a,m)=>a+m.kcal,0); // 5500
const TOTAL_PROT = MEALS.reduce((a,m)=>a+m.prot,0); // 245

const STORAGE_PREFIX = 'nut_90_97';
const WEIGHT_START = 90;
const WEIGHT_GOAL  = 97;
const GOAL_DATE    = '2026-10-22';
const START_DATE   = '2026-08-22';

const WEEKS = [
  {week:'W1',date:'2026-08-22',preset:90},
  {week:'W2',date:'2026-08-29'},
  {week:'W3',date:'2026-09-05'},
  {week:'W4',date:'2026-09-12'},
  {week:'W5',date:'2026-09-19'},
  {week:'W6',date:'2026-09-26'},
  {week:'W7',date:'2026-10-03'},
  {week:'W8',date:'2026-10-10'},
  {week:'W9',date:'2026-10-17'},
  {week:'Objectif',date:'2026-10-22'}

const MILESTONES = [
  {month:'7 septembre',target:92,date:'2026-09-07'},
  {month:'24 septembre',target:94,date:'2026-09-24'},
  {month:'10 octobre',target:96,date:'2026-10-10'},
  {month:'22 octobre',target:97,date:'2026-10-22'}

const INITIAL_WEIGHTS = {
  '2026-07-05':88.6,
  '2026-07-14':90,
  '2026-07-25':92.1,
  '2026-08-22':90,
  '2026-09-08':92.3,
  '2026-09-15':90.75
};

const TRAINING_PLAN = {
  1:{name:'Lundi',type:'Push + dos + abdos',items:[
    'Bench press prise large : échauffement 50kg',
    'Bench press prise large : 3x4 à 100kg, 2/3min rest, tenter 110kg si accompagné',
    'Bench press prise large : 2x4 à 90kg, 2/3min rest',

    'Lateral crunch : 20x4'
  ]},
  2:{name:'Mardi',type:'Cardio + abdos + mobilité',items:[
    'CARDIO : 5K',
    'Abdos',
    'Étirements mobilité',
    'Piste Melun : 18h30'
  ]},
  3:{name:'Mercredi',type:'Upper + bras + abdos',items:[
    'Bench press prise serrée : échauffement 50kg',
    'Bench press prise serrée : x4 à 100kg, 2/3min rest',
    'Bench press prise serrée : 2x4 à 90kg, 2/3min rest',
    'Bench press prise serrée : 3x6 à 80kg, 2/3min rest',
    'Bench press prise serrée : 3x8 à 70kg, 2/3min rest',
    'Bench press prise serrée : 3x12 à 60kg, 2/3min rest',
    'Tirage vertical large : 4x8-10 à 80kg',
    'Pull-over haltère : 3x12 à 22kg',
    'Skull crushers haltères : 6x6 à 14kg par main',
    'Curl barre EZ : 6x10 à 20-25kg',
    'Élévations latérales drop set : 4x12 à 16kg, puis 10kg, puis 6kg',
    'Dumbbell shrugs : 4x10 à 30-35kg par main',
    'Curl alterné : 3x10 à 14kg par main',
    'Poulie : 5x10 à 40kg',
    'Crunch : 25x7 à 20kg',
    'Plank : 1m20'
  ]},
  4:{name:'Jeudi',type:'Leg day + core',items:[
    'Échauffement jambes et hanches avant leg day',
    'Back squat : 5x5 à 70kg',
    'Romanian deadlift : 6x6 à 70kg, focus technique',
    'Leg press : 6x10 à 200kg, ajuster la machine',
    'Leg curl : 5x12 à 60kg',
    'Steps with dumbbell : 3x12 à 15kg',
    'Mollets debout : 6x12 à 50kg',
    'Hanging leg raises : 3x12',

  ]},
  5:{name:'Vendredi',type:'Pull + circuit + bench',items:[
    'Pull ups : 6x5',
    'Dips : 50 reps',
    'Upright row prise serrée : 3x10 à 30kg, ajouter du poids si possible',
    'Upright row prise large : 3x10 à 30kg, ajouter du poids si possible',
    'Tirage horizontal neutre : 60kg x3',
    'Triceps corde : 3x12 à 20-25kg',
    'Parcours x5 : 10 tractions',
    'Parcours x5 : 30 pompes',
    'Parcours x5 : 10 leg raises/knee raises',
    'Parcours x5 : 10 dips',
    'Bench press : 80kg x6 x4',
    'Crunch à la poulie : 4x12'
  ]},
  0:{name:'Dimanche',type:'Repos / récupération',items:['Repos actif ou mobilité légère']},
  6:{name:'Samedi',type:'Repos / récupération',items:['Repos actif ou mobilité légère']}
};

// ═══════════════════════════════════════════════════════
// STORAGE
// ═══════════════════════════════════════════════════════
function ls(k){return JSON.parse(localStorage.getItem(k)||'null')}
function ss(k,v){localStorage.setItem(k,JSON.stringify(v))}
function today(){return new Date().toISOString().slice(0,10)}
const CLOUD_ENDPOINT = '/api/nutrition-data';
let cloudReady = false;
let cloudStatus = 'local';
let cloudState = {meals:{},weights:null,training:{}};

function applyTheme(theme){
  document.body.classList.toggle('light',theme==='light');
  const el=document.getElementById('themeToggle');
  if(el)el.textContent=theme==='light'?'☀️':'🌙';
}
function currentTheme(){return localStorage.getItem(`${STORAGE_PREFIX}_theme`)||'light'}
function toggleTheme(){
  const next=currentTheme()==='dark'?'light':'dark';
  localStorage.setItem(`${STORAGE_PREFIX}_theme`,next);
  applyTheme(next);
}

function setCloudStatus(status){
  cloudStatus=status;
  const el=document.getElementById('cloudStatus');
  if(el)el.textContent=status==='synced'?'☁️ Sync':status==='saving'?'☁️ Sauvegarde...':'📱 Local';
}
async function setPin(){
  const current=localStorage.getItem(`${STORAGE_PREFIX}_pin`)||'';
  const pin=prompt('PIN de synchronisation Supabase',current);
  if(pin===null)return;
  localStorage.setItem(`${STORAGE_PREFIX}_pin`,pin.trim());
  await loadCloud();
  render();
}
async function loadCloud(){
  try{
    const res=await fetch(CLOUD_ENDPOINT,{headers:authHeaders()});
    if(!res.ok)throw new Error('cloud unavailable');
    cloudState=await res.json();
    cloudState.meals=cloudState.meals||{};
    cloudState.training=cloudState.training||{};
    cloudReady=true;
    mergeLocalIntoCloud();
    setCloudStatus('synced');
  }catch(e){
    setCloudStatus('local');
  }
}
function authHeaders(){
  const pin=localStorage.getItem(`${STORAGE_PREFIX}_pin`)||'';
  return pin?{'x-app-pin':pin}:{};
}
async function saveCloud(){
  if(!cloudReady)return;
  setCloudStatus('saving');
  try{
    const res=await fetch(CLOUD_ENDPOINT,{
      method:'POST',
      headers:{'content-type':'application/json',...authHeaders()},
      body:JSON.stringify(cloudState)
    });
    if(!res.ok)throw new Error('save failed');
    setCloudStatus('synced');
  }catch(e){
    setCloudStatus('local');
  }
}
function mealEntry(entry){
  if(entry&&typeof entry==='object'){
    return {status:entry.status||'pending',note:entry.note||''};
  }
  return {status:entry?'done':'pending',note:''};
}
function hasData(obj){
  return obj&&typeof obj==='object'&&Object.keys(obj).length>0;
}
function mergeLocalIntoCloud(){
  if(!cloudReady)return;
  let changed=false;
  cloudState.weights=cloudState.weights||{};
  Object.entries(INITIAL_WEIGHTS).forEach(([date,val])=>{
    if(!cloudState.weights[date]){
      cloudState.weights[date]=val;
      changed=true;
    }
  });
  const localMeals=ls(`${STORAGE_PREFIX}_meals_${today()}`)||{};
  if(hasData(localMeals)&&!hasData(cloudState.meals[today()])){
    cloudState.meals[today()]=localMeals;
    changed=true;
  }
  const localWeights=ls(`${STORAGE_PREFIX}_weights`)||{};
  if(hasData(localWeights)){
    cloudState.weights=cloudState.weights||{};
    Object.entries(localWeights).forEach(([date,val])=>{
      if(!cloudState.weights[date]){
        cloudState.weights[date]=val;
        changed=true;
      }
    });
  }
  const localTraining=ls(`${STORAGE_PREFIX}_training`)||{};
  if(hasData(localTraining)){
    cloudState.training=cloudState.training||{};
    Object.entries(localTraining).forEach(([date,val])=>{
      if(!cloudState.training[date]){
        cloudState.training[date]=val;
        changed=true;
      }
    });
  }
  if(changed)saveCloud();
}
function todayMeals(){
  return cloudReady?(cloudState.meals[today()]||{}):(ls(`${STORAGE_PREFIX}_meals_${today()}`)||{});
}
function saveMeals(d){
  ss(`${STORAGE_PREFIX}_meals_${today()}`,d);
  if(cloudReady){cloudState.meals[today()]=d;saveCloud();}
}
function weights(){
  const w=cloudReady?(cloudState.weights||{}):(ls(`${STORAGE_PREFIX}_weights`)||{});
  Object.entries(INITIAL_WEIGHTS).forEach(([date,val])=>{
    if(!w[date])w[date]=val;
  });
  return w;
}
function saveWeight(date,val){
  const w=weights();
  w[date]=val;
  ss(`${STORAGE_PREFIX}_weights`,w);
  if(cloudReady){cloudState.weights=w;saveCloud();}
}
function training(){
  return cloudReady?(cloudState.training||{}):(ls(`${STORAGE_PREFIX}_training`)||{});
}
function saveTraining(t){
  ss(`${STORAGE_PREFIX}_training`,t);
  if(cloudReady){cloudState.training=t;saveCloud();}
}
// ═══════════════════════════════════════════════════════
// NAV
// ═══════════════════════════════════════════════════════
let activeTab=0;
function switchTab(i){
  activeTab=i;
  [0,1,2,3].forEach(j=>{
    document.getElementById(`tab${j}`).classList.toggle('active',j===i);
  });
  render();
}

// ═══════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════
function render(){
  if(activeTab===0)renderToday();
  else if(activeTab===1)renderTraining();
  else if(activeTab===2)renderWeight();
  else renderHistory();
}

// ── TODAY ────────────────────────────────────────────
function renderToday(){
  const checked=todayMeals();
  const doneKcal=MEALS.filter(m=>mealEntry(checked[m.id]).status==='done').reduce((a,m)=>a+m.kcal,0);
  const doneProt=MEALS.filter(m=>mealEntry(checked[m.id]).status==='done').reduce((a,m)=>a+m.prot,0);
  const pctK=Math.round(doneKcal/TOTAL_KCAL*100);
  const pctP=Math.round(doneProt/TOTAL_PROT*100);
  const mealsDone=MEALS.filter(m=>mealEntry(checked[m.id]).status==='done').length;
  const mealsSkipped=MEALS.filter(m=>mealEntry(checked[m.id]).status==='skipped').length;
  // weight progress
  const w=weights();
  const lastWeight=Object.entries(w).sort((a,b)=>a[0]>b[0]?1:-1).filter(([,v])=>v).pop()?.[1]||WEIGHT_START;
  const totalGain=WEIGHT_GOAL-WEIGHT_START;
  const done=lastWeight-WEIGHT_START;
  const pctWeight=Math.max(0,Math.min(100,Math.round(done/totalGain*100)));
  // next milestone
  const nextM=MILESTONES.find(m=>lastWeight<m.target)||{month:'Objectif',target:WEIGHT_GOAL};
  const daysLeft=Math.round((new Date(GOAL_DATE)-new Date())/(1000*60*60*24));
  // ring stroke
  const circ=2*Math.PI*34;
  const offset=circ*(1-pctWeight/100);
  const mealsHTML=MEALS.map(m=>{
    const entry=mealEntry(checked[m.id]);
    const on=entry.status==='done';
    const skipped=entry.status==='skipped';
    return `<div class="meal-card${on?' checked':''}${skipped?' skipped':''}">
    <div class="meal-check${on?' on':''}${skipped?' skip':''}">${on?'✓':skipped?'×':''}</div>
    <div class="meal-body">
      <div class="meal-time">${m.time}</div>
      <div class="meal-name">${m.emoji} ${m.name}</div>
      <div class="meal-desc">${m.desc}</div>
      <div class="meal-macros">
        <span class="meal-chip mc-kcal">${m.kcal} kcal</span>
        <span class="meal-chip mc-prot">${m.prot}g prot</span>
      </div>
      <div class="meal-actions">
        <button class="meal-action done${on?' on':''}" onclick="setMealStatus('${m.id}','${on?'pending':'done'}')">Mangé</button>
        <button class="meal-action skip${skipped?' on':''}" onclick="setMealStatus('${m.id}','${skipped?'pending':'skipped'}')">Skippé</button>
      </div>
      <input class="meal-note" value="${escapeAttr(entry.note)}" placeholder="Ce que j'ai mangé / ajustement" onchange="setMealNote('${m.id}',this.value)" onclick="event.stopPropagation()">
    </div>
    </div>`;
  }).join('');
  document.getElementById('main').innerHTML=`
  <div class="hero-progress">
    <div class="ring-wrap">
      <svg width="80" height="80" viewBox="0 0 80 80">
        <circle class="ring-bg" cx="40" cy="40" r="34"/>
        <circle class="ring-fill" cx="40" cy="40" r="34" stroke-dasharray="${circ}" stroke-dashoffset="${offset}"/>
      </svg>
      <div class="ring-text">${lastWeight}<span class="ring-sub">kg</span></div>
    </div>
    <div class="hero-info">
      <h2>${pctWeight}% vers ${WEIGHT_GOAL}kg</h2>
      <p>${lastWeight}kg → ${WEIGHT_GOAL}kg · ${daysLeft}j restants</p>
      <p class="milestone">→ Prochain : ${nextM.target}kg en ${nextM.month}</p>
    </div>
  </div>
  <div class="macro-row">
    <div class="macro-card">
      <div class="mv" style="color:var(--orange)">${doneKcal}<span style="font-size:12px;color:#555"> / ${TOTAL_KCAL}</span></div>
      <div class="ml">Calories aujourd'hui</div>
      <div class="mp"><div class="mf kcal-fill" style="width:${pctK}%"></div></div>
    </div>
    <div class="macro-card">
      <div class="mv" style="color:var(--blue)">${doneProt}<span style="font-size:12px;color:#555">g / ${TOTAL_PROT}g</span></div>
      <div class="ml">Protéines aujourd'hui</div>
      <div class="mp"><div class="mf prot-fill" style="width:${pctP}%"></div></div>
    </div>
  </div>
  <div class="sec-lbl">${mealsDone}/6 mangés · ${mealsSkipped} skippé(s) · ${today()}</div>
  ${mealsHTML}`;
}

function escapeAttr(value){
  return String(value||'').replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;');
}

function toggleMeal(id){
  const d=todayMeals();
  const entry=mealEntry(d[id]);
  entry.status=entry.status==='done'?'pending':'done';
  d[id]=entry;
  saveMeals(d);
  render();
}

function setMealStatus(id,status){
  const d=todayMeals();
  const entry=mealEntry(d[id]);
  entry.status=status;
  d[id]=entry;
  saveMeals(d);
  render();
}

function setMealNote(id,note){
  const d=todayMeals();
  const entry=mealEntry(d[id]);
  entry.note=note.trim();
  d[id]=entry;
  saveMeals(d);
}

// ── WEIGHT ───────────────────────────────────────────
function renderWeight(){
  const w=weights();
  const todayStr=today();
  const weightRows=Object.entries(w)
    .filter(([,val])=>val)
    .sort((a,b)=>a[0]>b[0]?1:-1);
  const tableRows=weightRows.map(([date,val],i)=>{
    const week=WEEKS.find(wk=>wk.date===date)?.week||'Log';
    const prev=i>0?weightRows[i-1][1]:null;
    const delta=val&&prev?val-prev:null;
    const isCurrent=date===todayStr;
    let cls=isCurrent?'current':'';
    let deltaHTML='';
    if(delta!==null){
      const sign=delta>0?'+':'';
      deltaHTML=`<span class="${delta>=0?'delta-pos':'delta-neg'}">${sign}${delta.toFixed(1)}</span>`;
    }
    return `<tr class="${cls}">
      <td>${week}</td>
      <td>${date.slice(5)}</td>
      <td>${val?`<b>${val} kg</b>`:'—'}</td>
      <td>${deltaHTML||'—'}</td>
    </tr>`;
  }).join('');
  // chart
  const chartData=Object.entries(w).filter(([,val])=>val).map(([date,val])=>({date,val}));
  const chartHTML=buildWeightChart(chartData,w);
  // milestone statuses
  const lastW=Object.entries(w).sort((a,b)=>a[0]>b[0]?1:-1).filter(([d,v])=>v).pop()?.[1]||WEIGHT_START;
  const mHTML=MILESTONES.map(m=>{
    const done=lastW>=m.target;
    const pct=Math.min(100,Math.round((lastW-WEIGHT_START)/(m.target-WEIGHT_START)*100));
    return `<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #111">
      <span style="font-size:16px">${done?'✅':'⏳'}</span>
      <div style="flex:1">
        <div style="font-size:12px;font-weight:700">${m.month} — ${m.target}kg</div>
        <div style="height:4px;background:#1e1e1e;border-radius:2px;margin-top:5px;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:${done?'var(--accent)':'var(--orange)'};border-radius:2px;transition:width .4s"></div>
        </div>
      </div>
      <span style="font-size:11px;color:${done?'var(--accent)':'var(--muted)'};">${done?'✓':pct+'%'}</span>
    </div>`;
  }).join('');
  document.getElementById('main').innerHTML=`
  <div class="weight-input-card">
    <h3>⚖️ Entrer le poids de cette semaine</h3>
    <div class="weight-input-row">
      <input class="weight-input" id="weightIn" type="number" step="0.1" min="70" max="130" placeholder="ex: 91.2" value="${w[todayStr]||''}">
      <button class="weight-save-btn" onclick="doSaveWeight()">Sauvegarder</button>
    </div>
    <div style="font-size:11px;color:var(--muted);margin-top:8px">Peser le lundi matin à jeun, après les toilettes.</div>
    <div style="font-size:11px;color:var(--muted);margin-top:4px">Objectif 2 mois : 90kg → 97kg, soit environ +0,8kg/semaine.</div>
  </div>
  <div class="chart-card">
    <h4>Courbe de poids vers ${WEIGHT_GOAL}kg</h4>
    ${chartHTML}
  </div>
  <div class="chart-card">
    <h4>Jalons 2 mois</h4>
    ${mHTML}
  </div>
  <div class="chart-card" style="padding:0 16px 4px">
    <table class="weight-table">
      <thead><tr><th>Sem.</th><th>Date</th><th>Poids</th><th>Δ</th></tr></thead>
      <tbody>${tableRows}</tbody>
    </table>
  </div>`;
}

function doSaveWeight(){
  const val=parseFloat(document.getElementById('weightIn').value);
  if(!val||val<50||val>200)return;
  saveWeight(today(),val);
  render();
}

function buildWeightChart(pts,w){
  if(pts.length<1)return`<div style="text-align:center;padding:20px;color:var(--muted);font-size:13px">Aucun poids enregistré</div>`;
  const allDates=Array.from(new Set([...WEEKS.map(wk=>wk.date),...Object.keys(w).filter(d=>w[d])])).sort();
  const values=Object.values(w).filter(Boolean);
  const minW=Math.floor(Math.min(88,WEIGHT_START,...values))-1;
  const maxW=Math.ceil(Math.max(98,WEIGHT_GOAL,...values))+1;
  const svgW=Math.max(560,allDates.length*58);
  const svgH=280;
  const pad={l:50,r:30,t:32,b:48};
  const cw=svgW-pad.l-pad.r;
  const ch=svgH-pad.t-pad.b;
  function px(i){return allDates.length===1?pad.l+cw/2:pad.l+i*(cw/(allDates.length-1))}
  function py(v){return pad.t+ch-(v-minW)/(maxW-minW)*ch}
  // target line
  const tStart=py(WEIGHT_START);
  const tEnd=py(WEIGHT_GOAL);
  const targetLine=`<line x1="${pad.l}" y1="${tStart}" x2="${pad.l+cw}" y2="${tEnd}" stroke="#f97316" stroke-width="2" stroke-dasharray="6,6" opacity=".65"/>`;
  // milestone lines
  const mLines=MILESTONES.map(m=>{
    const mi=allDates.findIndex(d=>d>=m.date);
    if(mi<0)return'';
    const x=px(mi),y=py(m.target);
    return `<circle cx="${x}" cy="${y}" r="4" fill="#f97316" opacity=".85"/>
    <text x="${x+7}" y="${y-7}" font-size="10" fill="#f97316" opacity=".9">${m.target}kg</text>`;
  }).join('');
  // actual data line
  let linePath='',dotHTML='';
  const dataPoints=allDates.map((d,i)=>({i,v:w[d]||null})).filter(p=>p.v);
  if(dataPoints.length>1){
    linePath=`<polyline points="${dataPoints.map(p=>`${px(p.i)},${py(p.v)}`).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
  }
  dotHTML=dataPoints.map(p=>`<circle cx="${px(p.i)}" cy="${py(p.v)}" r="6" fill="var(--accent)" stroke="var(--card)" stroke-width="2"/>
  <text x="${px(p.i)}" y="${py(p.v)-12}" text-anchor="middle" font-size="11" fill="var(--accent)" font-weight="800">${p.v}</text>`).join('');
  // y axis
  const yStep=Math.max(1,Math.ceil((maxW-minW)/5));
  const yValues=[];
  for(let v=minW;v<=maxW;v+=yStep)yValues.push(v);
  if(!yValues.includes(WEIGHT_GOAL))yValues.push(WEIGHT_GOAL);
  const yLabels=yValues.sort((a,b)=>a-b).map(v=>`<text x="${pad.l-8}" y="${py(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text><line x1="${pad.l}" y1="${py(v)}" x2="${pad.l+cw}" y2="${py(v)}" stroke="var(--border)" stroke-width="1"/>`).join('');
  const xLabels=allDates.filter((_,i)=>i%2===0||i===allDates.length-1).map(d=>{const i=allDates.indexOf(d);return`<text x="${px(i)}" y="${svgH-16}" text-anchor="middle" font-size="11" fill="var(--muted)">${d.slice(5)}</text>`}).join('');
  return`<div class="chart-wrap">
  <svg viewBox="0 0 ${svgW} ${svgH}" width="${svgW}" height="${svgH}" xmlns="http://www.w3.org/2000/svg" style="min-width:${svgW}px">
    ${yLabels}${xLabels}${targetLine}${mLines}${linePath}${dotHTML}
    <line x1="${pad.l}" y1="${pad.t}" x2="${pad.l}" y2="${pad.t+ch}" stroke="var(--border)" stroke-width="1"/>
    <line x1="${pad.l}" y1="${pad.t+ch}" x2="${pad.l+cw}" y2="${pad.t+ch}" stroke="var(--border)" stroke-width="1"/>
    <text x="${pad.l+cw}" y="${Math.max(12,tEnd-8)}" text-anchor="end" font-size="10" fill="#f97316" font-weight="800">${WEIGHT_GOAL}kg objectif</text>
  </svg>
  <div style="font-size:11px;color:var(--muted);margin-top:8px;display:flex;gap:16px;flex-wrap:wrap">
    <span style="color:var(--accent)">● Poids réel</span>
    <span style="color:var(--orange)">- - Trajectoire cible</span>
    <span style="color:var(--orange)">● Milestones</span>
  </div>
  </div>`;
}

// ── TRAINING ─────────────────────────────────────────
function renderTraining(){
  const day=new Date().getDay();
  const plan=TRAINING_PLAN[day]||TRAINING_PLAN[0];
  const date=today();
  const all=training();
  const state=all[date]||{done:{},comment:''};
  const doneCount=plan.items.filter((_,i)=>state.done&&state.done[i]).length;
  const weekHTML=[1,2,3,4,5,6,0].map(dayNum=>{
    const p=TRAINING_PLAN[dayNum];
    const isToday=dayNum===day;
    const doneForToday=isToday?doneCount:null;
    const progress=isToday?`${doneForToday}/${p.items.length}`:`${p.items.length} blocs`;
    const details=p.items.map(item=>`<div class="week-exercise">
      <div class="exercise-illus">${exerciseIcon(item)}</div>
      <div>${item}</div>
    </div>`).join('');
    return `<details class="week-day${isToday?' today':''}" ${isToday?'open':''}>
      <summary>
      <div class="week-day-top">
        <div class="week-day-name">${p.name}</div>
        <div class="week-day-progress">${progress} · ouvrir</div>
      </div>
      <div class="week-day-type">${p.type}</div>
      </summary>
      <div class="week-exercises">${details}</div>
    </details>`;
  }).join('');
  const exerciseHTML=plan.items.map((item,i)=>{
    const on=!!(state.done&&state.done[i]);
    return `<div class="exercise-row" onclick="toggleExercise(${i})">
      <div class="exercise-check${on?' on':''}">${on?'✓':''}</div>
      <div class="exercise-illus">${exerciseIcon(item)}</div>
      <div class="exercise-text${on?' done-text':''}">${item}</div>
    </div>`;
  }).join('');
  document.getElementById('main').innerHTML=`
  <div class="training-day">
    <h3>📆 Plan de la semaine</h3>
    <div class="training-meta">Vue rapide de la structure hebdo.</div>
    <div class="week-grid">${weekHTML}</div>
  </div>
  <div class="training-day">
    <h3>🏋️ ${plan.name}</h3>
    <div class="training-meta">${plan.type} · ${doneCount}/${plan.items.length} exercices · ${date}</div>
    ${exerciseHTML}
  </div>
  <div class="training-day">
    <h3>📝 Commentaire séance</h3>
    <div class="training-meta">Note les charges réelles, sensations, douleur, énergie, reps ratées ou progression à tenter.</div>
    <textarea class="session-comment" placeholder="Ex: Bench 100kg OK sur 2 séries, dernière série dure. Épaule droite sensible. Prochaine fois rester à 100 avant 110." onchange="setTrainingComment(this.value)">${escapeText(state.comment||'')}</textarea>
  </div>`;
}

function exerciseIcon(item){
  const s=item.toLowerCase();
  if(s.includes('bench')||s.includes('développé incliné')||s.includes('dips')||s.includes('pompes'))return'🏋️';
  if(s.includes('squat')||s.includes('deadlift')||s.includes('leg ')||s.includes('mollets')||s.includes('steps'))return'🦵';
  if(s.includes('cardio')||s.includes('5k')||s.includes('piste'))return'🏃';
  if(s.includes('crunch')||s.includes('plank')||s.includes('raises')||s.includes('abdos'))return'◎';
  if(s.includes('curl')||s.includes('skull')||s.includes('triceps'))return'💪';
  if(s.includes('row')||s.includes('tirage')||s.includes('pull')||s.includes('shrugs'))return'↔';
  if(s.includes('latérales')||s.includes('épaules')||s.includes('upright'))return'△';
  if(s.includes('stretch')||s.includes('mobilité')||s.includes('repos'))return'☁';
  if(s.includes('poulie'))return'⇅';
  return'•';
}

function escapeText(value){
  return String(value||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
}

function toggleExercise(idx){
  const all=training();
  const date=today();
  const state=all[date]||{done:{},comment:''};
  state.done=state.done||{};
  state.done[idx]=!state.done[idx];
  all[date]=state;
  saveTraining(all);
  render();
}

function setTrainingComment(comment){
  const all=training();
  const date=today();
  const state=all[date]||{done:{},comment:''};
  state.comment=comment;
  all[date]=state;
  saveTraining(all);
}

// ── HISTORY ──────────────────────────────────────────
function renderHistory(){
  const allMeals=cloudReady?(cloudState.meals||{}):collectLocalMeals();
  const dates=Object.keys(allMeals).sort().reverse();
  let totalKcal=0,totalProt=0,doneMeals=0,skippedMeals=0,notesCount=0;
  const daysHTML=dates.map(date=>{
    const dayMeals=allMeals[date]||{};
    const lines=MEALS.map(meal=>{
      const entry=mealEntry(dayMeals[meal.id]);
      if(entry.status==='pending'&&!entry.note)return'';
      if(entry.status==='done'){
        totalKcal+=meal.kcal;
        totalProt+=meal.prot;
        doneMeals++;
      }
      if(entry.status==='skipped')skippedMeals++;
      if(entry.note)notesCount++;
      const status=entry.status==='done'?'Mangé':entry.status==='skipped'?'Skippé':'Note';
      const kcal=entry.status==='done'?` · ${meal.kcal} kcal · ${meal.prot}g prot`:'';
      const note=entry.note?`<span class="history-note">${escapeText(entry.note)}</span>`:'';
      return `<div class="history-line">${meal.time} · ${meal.name} · ${status}${kcal}${note}</div>`;
    }).join('');
    if(!lines)return'';
    const label=new Date(`${date}T12:00:00`).toLocaleDateString('fr-FR',{weekday:'long',day:'2-digit',month:'short',year:'numeric'});
    return `<div class="history-card">
      <div class="history-date">${label}</div>
      ${lines}
    </div>`;
  }).join('');
  document.getElementById('main').innerHTML=`
  <div class="history-card">
    <h3>📊 Historique complet</h3>
    <div class="training-meta">Tous les repas enregistrés, depuis le début du tracking synchronisé.</div>
    <div class="history-summary">
      <div class="history-stat"><strong>${totalKcal}</strong><span>kcal mangées</span></div>
      <div class="history-stat"><strong>${totalProt}g</strong><span>protéines</span></div>
      <div class="history-stat"><strong>${doneMeals}</strong><span>repas mangés</span></div>
      <div class="history-stat"><strong>${skippedMeals}</strong><span>repas skippés</span></div>
      <div class="history-stat"><strong>${dates.length}</strong><span>jours trackés</span></div>
      <div class="history-stat"><strong>${notesCount}</strong><span>notes</span></div>
    </div>
  </div>
  ${daysHTML||'<div class="history-card"><div class="training-meta">Aucun repas enregistré pour le moment.</div></div>'}`;
}

function collectLocalMeals(){
  const out={};
  Object.keys(localStorage).forEach(key=>{
    const prefix=`${STORAGE_PREFIX}_meals_`;
    if(!key.startsWith(prefix))return;
    out[key.slice(prefix.length)]=ls(key)||{};
  });
  return out;
}

// INIT
applyTheme(currentTheme());
loadCloud().then(render);
render();
</script>
